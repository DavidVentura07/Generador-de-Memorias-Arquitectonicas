<style>
  :root{
    --ink:#0F1A24;
    --ink-2:#33475B;
    --ink-3:#6B8299;
    --rule:#C7D2DC;
    --rule-2:#E3EAF0;
    --paper:#FFFFFF;
    --paper-2:#F3F6F8;
    --azul:#1D4E89;
    --azul-soft:#E7EEF6;
    --verde:#1E7A46;
    --ambar:#A96A00;
    --rojo:#B3261E;
    --rojo-soft:#FBEAE8;
    --ambar-soft:#FBF2E3;
    --verde-soft:#E8F3EC;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  .mdapp{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;}
  .mdapp button{font-family:inherit}

  /* ---- encabezado ---- */
  .hd{border-bottom:2px solid var(--ink);padding:0 0 14px;margin-bottom:0}
  .hd h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
  .hd p{margin:0;color:var(--ink-3);font-size:12px}
  .hd-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .proj-chip{font-family:var(--mono);font-size:11px;background:var(--azul-soft);color:var(--azul);
    padding:5px 10px;border:1px solid var(--rule);white-space:nowrap}

  /* ---- estructura ---- */
  .shell{display:grid;grid-template-columns:198px 1fr;gap:0;min-height:520px}
  .rail{border-right:1px solid var(--rule);padding:14px 12px 40px 0}
  .rail button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;
    border:0;padding:6px 8px;cursor:pointer;color:var(--ink-2);font-size:12.5px;border-left:2px solid transparent}
  .rail button:hover{background:var(--paper-2)}
  .rail button.on{color:var(--azul);border-left-color:var(--azul);background:var(--azul-soft);font-weight:600}
  .rail .cod{font-family:var(--mono);font-size:10px;color:var(--ink-3);min-width:20px}
  .rail button.on .cod{color:var(--azul)}
  .rail .grp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
    padding:14px 8px 4px;font-weight:600}
  .pane{padding:18px 0 18px 22px;min-width:0}
  .pane h2{font-size:15px;margin:0 0 2px;font-weight:700}
  .pane .sub{color:var(--ink-3);font-size:12px;margin:0 0 16px}

  /* ---- cota: firma visual ---- */
  .cota{display:flex;align-items:center;gap:7px;margin:22px 0 10px}
  .cota span{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-2);white-space:nowrap;font-weight:600}
  .cota i{flex:1;height:1px;background:var(--rule);position:relative}
  .cota i::before,.cota i::after{content:"";position:absolute;top:-3px;width:1px;height:7px;background:var(--rule)}
  .cota i::before{left:0}.cota i::after{right:0}

  /* ---- campos ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px 14px}
  .f label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:3px;font-weight:500}
  .f input,.f select,.f textarea{width:100%;padding:6px 8px;border:1px solid var(--rule);
    background:var(--paper);font-family:var(--sans);font-size:13px;color:var(--ink)}
  .f input[type=number],.f .num{font-family:var(--mono)}
  .f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--azul);outline-offset:-1px;border-color:var(--azul)}
  .f .hint{font-size:10.5px;color:var(--ink-3);margin-top:3px}
  .f textarea{min-height:56px;resize:vertical}
  .wide{grid-column:1/-1}
  .sw{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--rule);
    background:var(--paper-2);margin:4px 0 2px}
  .sw input{width:16px;height:16px;accent-color:var(--azul);flex:0 0 auto}
  .sw div{font-size:12.5px}
  .sw b{display:block;font-size:13px}
  .sw small{color:var(--ink-3);font-size:11px}

  /* ---- repetibles ---- */
  .rep{border:1px solid var(--rule);margin-bottom:9px}
  .rep-h{display:flex;justify-content:space-between;align-items:center;background:var(--paper-2);
    padding:5px 10px;border-bottom:1px solid var(--rule)}
  .rep-h span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
  .rep-b{padding:11px}
  .btn{border:1px solid var(--rule);background:var(--paper);padding:5px 11px;font-size:12px;
    cursor:pointer;color:var(--ink-2)}
  .btn:hover{border-color:var(--azul);color:var(--azul)}
  .btn.pri{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
  .btn.pri:hover{background:#173D6C}
  .btn.dgr{color:var(--rojo);border-color:var(--rule)}
  .btn.dgr:hover{border-color:var(--rojo)}
  .btn.sm{padding:3px 8px;font-size:11px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* ---- tablero ---- */
  .chk{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--rule-2);margin-bottom:6px;align-items:flex-start}
  .chk.r{background:var(--rojo-soft);border-color:#EBC3BF}
  .chk.a{background:var(--ambar-soft);border-color:#EBDCC0}
  .chk.v{background:var(--verde-soft);border-color:#C6E0D0}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .dot.r{background:var(--rojo)}.dot.a{background:var(--ambar)}.dot.v{background:var(--verde)}
  .chk b{font-size:12.5px;display:block}
  .chk .val{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .chk small{color:var(--ink-3);font-size:11px;display:block;margin-top:2px}
  .tally{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tally div{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border:1px solid var(--rule)}
  .tally .r{background:var(--rojo-soft);color:var(--rojo);border-color:#EBC3BF}
  .tally .a{background:var(--ambar-soft);color:var(--ambar);border-color:#EBDCC0}
  .tally .v{background:var(--verde-soft);color:var(--verde);border-color:#C6E0D0}

  /* ---- tabla derivados ---- */
  table.calc{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
  table.calc th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);border-bottom:1px solid var(--rule);padding:5px 8px 5px 0;font-weight:600}
  table.calc td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule-2);vertical-align:top}
  table.calc td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
  table.calc td.c{font-family:var(--mono);color:var(--ink-3);font-size:11px;width:44px}

  /* ---- proyectos ---- */
  .plist{border:1px solid var(--rule)}
  .pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
    border-bottom:1px solid var(--rule-2)}
  .pitem:last-child{border-bottom:0}
  .pitem.on{background:var(--azul-soft)}
  .pitem b{font-size:13px}
  .pitem small{color:var(--ink-3);font-family:var(--mono);font-size:10.5px;display:block}
  .empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px;border:1px dashed var(--rule)}

  /* ---- ficha ---- */
  .ficha{width:100%;height:400px;font-family:var(--mono);font-size:11px;line-height:1.55;
    border:1px solid var(--rule);padding:12px;background:var(--paper-2);color:var(--ink);resize:vertical}
  .note{border-left:3px solid var(--azul);background:var(--azul-soft);padding:10px 12px;
    font-size:12px;margin:12px 0}
  .note.warn{border-left-color:var(--ambar);background:var(--ambar-soft)}

  /* ---- barra cota inferior ---- */
  .bar{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--ink);
    padding:9px 0 4px;margin-top:20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .bar .cell{display:flex;flex-direction:column;gap:1px}
  .bar .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .bar .v{font-family:var(--mono);font-size:13px;font-weight:600}
  .bar .v.r{color:var(--rojo)}.bar .v.a{color:var(--ambar)}.bar .v.v{color:var(--verde)}
  .bar .sp{flex:1}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;font-size:12.5px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}

  @media(max-width:720px){
    .shell{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:1px solid var(--rule);padding:8px 0 10px;
      display:flex;gap:4px;overflow-x:auto}
    .rail button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:6px 10px}
    .rail button.on{border-left:0;border-bottom-color:var(--azul)}
    .rail .grp{display:none}
    .pane{padding:16px 0}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="mdapp">
  <div class="hd">
    <div class="hd-row">
      <div>
        <h1>Captura de variables — Memoria descriptiva</h1>
        <p>Vivienda plurifamiliar · Ciudad de México · v1</p>
      </div>
      <div class="proj-chip" id="chip">Sin proyecto abierto</div>
    </div>
  </div>

  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main class="pane" id="pane"></main>
  </div>

  <div class="bar" id="bar"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   ESTADO
   ============================================================ */
var S = null;          // proyecto abierto
var IDX = [];          // índice de proyectos
var VIEW = "proy";
var DIRTY = false;

function nuevoProyecto(nombre){
  return {
    id: "p" + Date.now(),
    nombre: nombre || "Proyecto sin nombre",
    actualizado: new Date().toISOString(),
    ident:{denominacion:"",calle:"",colonia:"",alcaldia:"",cp:"",propietario:"",dro:"",proyectista:"",fecha:"",despacho:""},
    predio:{
      fusion:false, origen:[], docFusion:{tipo:"",numero:"",autoridad:"",fecha:""},
      supEscritura:"", supLevantamiento:"", forma:"Rectangular", frentes:"1", vialidad:"",
      numOficial:"", escritura:"", linderos:[], cuentaCatastral:"", alineamiento:""
    },
    suelo:{
      folio:"", fecha:"", clave:"", uso:"", niveles:"", areaLibre:"", densidad:"", densidadM2:"",
      norma:"",
      pot:{activo:false, instrumento:"", folio:"", autoridad:"", fecha:"", m2:"", emisor:"",
           modNiveles:false, nivelesExtra:"", modAreaLibre:false, areaLibreNueva:"", modDensidad:false, densidadNueva:""}
    },
    niveles:{banqueta:"0.00", pretil:"", lista:[]},
    viv:{total:"", porNivel:[], supMin:"", supMax:"", prototipos:"", locales:"", recamaras:"",
         alturaLibre:"", anchoRec:"", anchoOtros:"", anchoEstancia:""},
    patios:{nptHab:"", nivelParamento:"", cubierta:false, tipoCubierta:"", alturaCubierta:"", lista:[]},
    estac:{niveles:[], rampas:[], pcdCant:"", pcdDim:"", angulo:"90", pasillo:"", accesos:"", maxPorViv:"3"},
    elev:{nucleos:"", cantidad:"", nivelesServidos:"", capCabina:"10", rtt:"90", pctDiseno:"10",
          intervalo:"60", ocupRec:"2", adicional:"1", escaleras:""},
    comunes:{control:"", amenidades:"", servicios:"", tecnicas:"", bodegas:"", bici:"", basura:""},
    graficos:[],
    pendientes:""
  };
}

var GRAFICOS_BASE = [
  ["Croquis de ubicación","1.1 Características del predio",true],
  ["Plano de la fusión de predios","1.2 Antecedentes de propiedad y fusión",false],
  ["Recorte del PDDU","1.3 Uso de suelo",true],
  ["Tabla de densidades","1.3 Uso de suelo",false],
  ["Simbología de suelo urbano","1.3 Uso de suelo",false],
  ["Tabla de ocupación del suelo (COS)","1.4 COS",true],
  ["Tabla de utilización del suelo (CUS)","1.5 CUS",true],
  ["Tabla de superficies por nivel","1.5 CUS",true],
  ["Diagrama de niveles y superficies","1.5 CUS",false],
  ["Planta arquitectónica de semisótano","2.1 Descripción por niveles",true],
  ["Planta arquitectónica de planta baja","2.2 Descripción por niveles",true],
  ["Planta arquitectónica de nivel tipo","2.3 Descripción por niveles",true],
  ["Planta de azotea","2.4 Azotea y techos",true],
  ["Detalle de cubierta en azotea","2.4 Azotea y techos",false],
  ["Corte arquitectónico transversal","2.5 Alturas",true],
  ["Esquema de patio mínimo normativo","2.6 Cálculo de patios",true],
  ["Esquema de patio tipo del proyecto","2.6 Cálculo de patios",true],
  ["Esquema de patio posterior","2.6 Cálculo de patios",false]
];

/* ============================================================
   ALMACENAMIENTO
   ============================================================ */
async function cargarIndice(){
  try{
    var r = await window.storage.get("mem:index");
    IDX = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ IDX = []; }
}
async function guardarIndice(){
  try{ await window.storage.set("mem:index", JSON.stringify(IDX)); }
  catch(e){ toast("No se pudo guardar el índice de proyectos"); }
}
async function guardar(silencio){
  if(!S) return;
  S.actualizado = new Date().toISOString();
  try{
    await window.storage.set("mem:proj:"+S.id, JSON.stringify(S));
    var i = IDX.findIndex(function(x){return x.id===S.id});
    var meta = {id:S.id, nombre:S.nombre, actualizado:S.actualizado};
    if(i>=0) IDX[i]=meta; else IDX.unshift(meta);
    await guardarIndice();
    DIRTY=false;
    if(!silencio) toast("Proyecto guardado");
    pintarChip();
  }catch(e){ toast("No se pudo guardar. Revisa la conexión e inténtalo otra vez"); }
}
async function abrir(id){
  try{
    var r = await window.storage.get("mem:proj:"+id);
    S = JSON.parse(r.value);
    // migración defensiva de campos añadidos después
    var base = nuevoProyecto();
    for(var k in base){ if(!(k in S)) S[k]=base[k]; }
    if(!S.graficos || !S.graficos.length) S.graficos = graficosIniciales();
    VIEW="ident"; render();
  }catch(e){ toast("No se pudo abrir el proyecto"); }
}
async function borrar(id){
  try{
    await window.storage.delete("mem:proj:"+id);
    IDX = IDX.filter(function(x){return x.id!==id});
    await guardarIndice();
    if(S && S.id===id){ S=null; VIEW="proy"; }
    render(); toast("Proyecto eliminado");
  }catch(e){ toast("No se pudo eliminar el proyecto"); }
}
function graficosIniciales(){
  return GRAFICOS_BASE.map(function(g,i){
    return {id:i+1, nombre:g[0], seccion:g[1], obligatorio:g[2], estado:"Pendiente"};
  });
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function n(v){ var x=parseFloat(String(v).replace(/,/g,"")); return isNaN(x)?null:x; }
function fmt(v,d){ if(v===null||v===undefined||isNaN(v)) return "—";
  return Number(v).toLocaleString("es-MX",{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d}); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function get(path){ var o=S,p=path.split("."); for(var i=0;i<p.length;i++){ if(o===undefined||o===null) return ""; o=o[p[i]]; } return o===undefined||o===null?"":o; }
function set(path,val){ var o=S,p=path.split("."); for(var i=0;i<p.length-1;i++){ if(!o[p[i]]) o[p[i]]={}; o=o[p[i]]; } o[p[p.length-1]]=val; DIRTY=true; }
var tt=null;
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on")},2200); }

/* ============================================================
   MOTOR DE CÁLCULO
   ============================================================ */
function calc(){
  var c={};
  var p=S.predio, s=S.suelo;

  // --- superficie del predio ---
  c.sumaOrigen = p.fusion ? p.origen.reduce(function(a,b){ return a + (n(b.sup)||0) },0) : null;
  c.supEscritura = p.fusion ? (c.sumaOrigen||null) : n(p.supEscritura);
  c.supLevantamiento = n(p.supLevantamiento);
  c.supPredio = c.supLevantamiento !== null ? c.supLevantamiento : c.supEscritura;
  c.difSup = (c.supEscritura!==null && c.supLevantamiento!==null) ? (c.supLevantamiento - c.supEscritura) : null;

  // --- coeficientes ---
  var al = n(s.areaLibre), niv = n(s.niveles);
  c.areaLibrePct = al; c.nivelesPermitidos = niv;
  c.cos = (c.supPredio!==null && al!==null) ? c.supPredio*(1-al/100) : null;
  c.areaLibreReq = (c.supPredio!==null && al!==null) ? c.supPredio*(al/100) : null;
  c.factorCUS = (al!==null && niv!==null) ? (1-al/100)*niv : null;
  c.supMaxBase = (c.cos!==null && niv!==null) ? c.cos*niv : null;
  c.potM2 = s.pot.activo ? n(s.pot.m2) : null;
  c.supMaxTotal = c.supMaxBase!==null ? c.supMaxBase + (c.potM2||0) : null;

  // --- niveles ---
  var L=S.niveles.lista;
  c.supSNB = L.filter(function(x){return x.snb}).reduce(function(a,b){ return a+(n(b.hab)||0)+(n(b.noHab)||0) },0);
  c.supBNB = L.filter(function(x){return !x.snb}).reduce(function(a,b){ return a+(n(b.hab)||0)+(n(b.noHab)||0) },0);
  c.supTotal = c.supSNB + c.supBNB;
  var d = L.filter(function(x){return x.desplante});
  c.desplante = d.length ? d.reduce(function(a,b){ return a+(n(b.hab)||0)+(n(b.noHab)||0) },0) : null;
  c.nivelesProyectados = L.filter(function(x){return x.cuenta}).length;
  c.holguraCOS = (c.cos!==null && c.desplante!==null) ? c.cos-c.desplante : null;
  c.pctDesplante = (c.desplante!==null && c.supPredio) ? c.desplante/c.supPredio*100 : null;
  c.areaLibreReal = (c.supPredio!==null && c.desplante!==null) ? c.supPredio-c.desplante : null;
  c.pctAreaLibre = (c.areaLibreReal!==null && c.supPredio) ? c.areaLibreReal/c.supPredio*100 : null;
  c.holguraCUS = (c.supMaxTotal!==null) ? c.supMaxTotal-c.supSNB : null;
  c.nivelesTope = niv!==null ? niv + (s.pot.activo && s.pot.modNiveles ? (n(s.pot.nivelesExtra)||0) : 0) : null;

  // --- vivienda y densidad ---
  var tv=n(S.viv.total);
  c.totalViviendas = tv;
  c.sumaPorNivel = S.viv.porNivel.reduce(function(a,b){ return a+(n(b.cant)||0) },0);
  var dm2 = s.pot.activo && s.pot.modDensidad ? n(s.pot.densidadNueva) : n(s.densidadM2);
  c.densidadM2 = dm2;
  c.vivPermitidas = (dm2 && c.supPredio!==null) ? Math.floor(c.supPredio/dm2) : null;

  // --- población y elevadores ---
  var e=S.elev;
  c.poblacion = tv!==null ? tv*((n(e.ocupRec)||0)*(n(e.recamaras)||n(S.viv.recamaras)||0)+(n(e.adicional)||0)) : null;
  c.movilizar = (c.poblacion!==null && n(e.pctDiseno)!==null) ? c.poblacion*n(e.pctDiseno)/100 : null;
  c.capElev = (n(e.rtt)&&n(e.capCabina)) ? (300/n(e.rtt))*n(e.capCabina) : null;
  c.elevTeorico = (c.movilizar!==null && c.capElev) ? c.movilizar/c.capElev : null;
  c.elevMin = c.elevTeorico!==null ? Math.ceil(c.elevTeorico) : null;

  // --- patios ---
  var pa=S.patios;
  var sup = n(pa.nivelParamento), inf = n(pa.nptHab);
  c.alturaParamento = (sup!==null && inf!==null) ? sup-(inf+0.90) : null;
  c.ladoMin = c.alturaParamento!==null ? c.alturaParamento/3 : null;
  c.ladoReducido = c.ladoMin!==null ? c.ladoMin*0.8 : null;
  c.ortogonalReq = c.ladoMin!==null ? c.ladoMin*1.2 : null;
  c.patios = pa.lista.map(function(x){
    var corto=n(x.corto), largo=n(x.largo), r={nombre:x.nombre||"Patio", cant:n(x.cant)||1, corto:corto, largo:largo};
    if(corto===null||largo===null||c.ladoMin===null){ r.estado="sin datos"; return r; }
    r.sup = corto*largo;
    if(corto >= c.ladoMin - 0.0001){ r.estado="cumple"; r.deficit=0; }
    else if(corto >= c.ladoReducido - 0.0001 && largo >= c.ortogonalReq - 0.0001){ r.estado="cumple con reducción"; r.deficit=0; }
    else { r.estado="no cumple"; r.deficit = Math.max(c.ladoReducido-corto, 0); r.faltaOrtogonal = largo < c.ortogonalReq; }
    return r;
  });

  // --- estacionamiento ---
  var g=0,ch=0;
  S.estac.niveles.forEach(function(x){ g+=n(x.grandes)||0; ch+=n(x.chicos)||0; });
  c.cajGrandes=g; c.cajChicos=ch; c.cajTotal=g+ch;
  c.cajMax = (tv!==null && n(S.estac.maxPorViv)!==null) ? tv*n(S.estac.maxPorViv) : null;
  c.pctGrandes = c.cajTotal ? g/c.cajTotal*100 : null;
  c.pctChicos = c.cajTotal ? ch/c.cajTotal*100 : null;
  c.ratioCajones = (c.cajMax) ? c.cajTotal/c.cajMax : null;
  c.rampas = S.estac.rampas.map(function(r){
    var lo=n(r.long), pe=n(r.pend), de=n(r.desnivel), o={long:lo,ancho:r.ancho,pend:pe,desnivel:de};
    if(lo!==null&&pe!==null){ o.salva = lo*pe/100; o.dif = de!==null ? o.salva-de : null; }
    return o;
  });
  return c;
}

/* ============================================================
   SEMÁFORO  (solo vive aquí; nunca entra al documento)
   ============================================================ */
function revisar(c){
  var A=[];
  function add(l,t,v,d){ A.push({l:l,t:t,v:v,d:d}); }

  if(c.supPredio===null) add("a","Superficie del predio sin capturar","—","Sin ella no se calcula ningún coeficiente");
  if(c.difSup!==null && Math.abs(c.difSup)>0.005)
    add("a","Escritura y levantamiento no coinciden", fmt(c.difSup)+" m²",
      "Decide con cuál se calcula y déjalo justificado. Es un error que se arrastra hasta el CUS");

  if(c.holguraCUS!==null){
    if(c.holguraCUS < -0.005) add("r","CUS excedido", fmt(c.holguraCUS)+" m²","La superficie sobre banqueta supera el máximo permitido");
    else if(c.holguraCUS < 0.005) add("r","CUS agotado al 100%","0.00 m²","Cero tolerancia: cualquier criterio distinto del revisor tira el proyecto");
    else if(c.holguraCUS < 30) add("a","Holgura de CUS muy corta", fmt(c.holguraCUS)+" m²","Deja al menos 30 m² de margen");
    else add("v","Holgura de CUS", fmt(c.holguraCUS)+" m²","");
  }
  if(c.holguraCOS!==null){
    if(c.holguraCOS < -0.005) add("r","Desplante mayor que el COS", fmt(c.holguraCOS)+" m²","El área libre proyectada es menor que la exigida");
    else if(c.holguraCOS < 10) add("a","Holgura de COS corta", fmt(c.holguraCOS)+" m²","");
    else add("v","Holgura de COS", fmt(c.holguraCOS)+" m²","");
  }
  if(c.nivelesTope!==null && c.nivelesProyectados){
    if(c.nivelesProyectados > c.nivelesTope)
      add("r","Niveles proyectados por encima del tope", c.nivelesProyectados+" vs "+c.nivelesTope,
        S.suelo.pot.activo ? "El potencial adquirido suma superficie, no necesariamente niveles" : "Revisa contra el certificado");
    else add("v","Niveles dentro del tope", c.nivelesProyectados+" de "+c.nivelesTope,"");
  }
  if(c.vivPermitidas!==null && c.totalViviendas!==null){
    if(c.totalViviendas > c.vivPermitidas)
      add("r","Viviendas por encima de la densidad", c.totalViviendas+" vs "+c.vivPermitidas,"Resuelve qué densidad aplica antes de generar el documento");
    else add("v","Viviendas dentro de la densidad", c.totalViviendas+" de "+c.vivPermitidas,"");
  } else if(c.totalViviendas!==null){
    add("a","Densidad sin aterrizar","—","Captura los m² de terreno por vivienda que aplican a este predio");
  }
  if(c.totalViviendas!==null && c.sumaPorNivel && Math.abs(c.sumaPorNivel-c.totalViviendas)>0)
    add("r","Las viviendas por nivel no suman el total", c.sumaPorNivel+" vs "+c.totalViviendas,"");

  if(c.alturaParamento===null) add("a","Altura de paramento de patios sin definir","—","Faltan el NPT habitable más bajo o el nivel superior del paramento");
  c.patios.forEach(function(p){
    if(p.estado==="no cumple")
      add("r","Patio «"+p.nombre+"» por debajo del mínimo", fmt(p.corto)+" m",
        "Faltan "+fmt(p.deficit)+" m para el mínimo reducido de "+fmt(c.ladoReducido)+" m"+(p.faltaOrtogonal?". Además la ortogonal no llega a "+fmt(c.ortogonalReq)+" m":""));
    else if(p.estado==="cumple con reducción")
      add("a","Patio «"+p.nombre+"» cumple solo con la reducción de 1/5", fmt(p.corto)+" m","Sin margen si cambia la altura de paramento");
    else if(p.estado==="cumple")
      add("v","Patio «"+p.nombre+"»", fmt(p.corto)+" × "+fmt(p.largo)+" m","");
  });
  if(S.patios.cubierta)
    add("a","Patios con cubierta","—","Verifica en la NTC vigente si un patio normativo admite cubrirse sin perder su función");

  if(c.pctGrandes!==null){
    if(c.pctGrandes < 40) add("r","Cajones grandes por debajo del 40%", fmt(c.pctGrandes,1)+"%",
      "Faltan "+Math.ceil(c.cajTotal*0.4 - c.cajGrandes)+" cajones grandes");
    else if(c.pctGrandes < 42) add("a","Cajones grandes al límite", fmt(c.pctGrandes,1)+"%","");
    else add("v","Cajones grandes", fmt(c.pctGrandes,1)+"%","");
  }
  if(c.ratioCajones!==null && c.ratioCajones>1)
    add("r","Cajones por encima del máximo permitido", c.cajTotal+" vs "+c.cajMax,"");
  c.rampas.forEach(function(r,i){
    if(r.dif!==null && Math.abs(r.dif)>0.02)
      add("a","Rampa "+(i+1)+": longitud y pendiente no dan el desnivel", fmt(r.salva)+" vs "+fmt(r.desnivel)+" m","");
  });
  if(c.elevMin!==null && n(S.elev.cantidad)!==null){
    if(n(S.elev.cantidad) < c.elevMin) add("r","Elevadores por debajo del mínimo", S.elev.cantidad+" vs "+c.elevMin,"");
    else add("v","Elevadores", S.elev.cantidad+" (mínimo "+c.elevMin+")","");
  }
  if(S.suelo.pot.activo && !S.suelo.pot.instrumento)
    add("a","Instrumento de potencial sin identificar","—","Pendiente por confirmar. El documento no debe nombrar un instrumento que no esté verificado");
  if(S.predio.fusion && !S.predio.docFusion.tipo)
    add("a","Documento que avala la fusión sin identificar","—","Pendiente por confirmar");
  return A;
}

function pintarBarra(){

/* --- constructores de campo --- */
function F(path,label,opt){
  opt=opt||{};
  var v=esc(get(path));
  var h='<div class="f'+(opt.wide?" wide":"")+'"><label>'+esc(label)+'</label>';
  if(opt.type==="select"){
    h+='<select data-p="'+path+'">';
    opt.opts.forEach(function(o){ h+='<option'+(String(get(path))===String(o)?" selected":"")+'>'+esc(o)+'</option>'; });
    h+='</select>';
  } else if(opt.type==="area"){
    h+='<textarea data-p="'+path+'" placeholder="'+esc(opt.ph||"")+'">'+v+'</textarea>';
  } else {
    h+='<input data-p="'+path+'" type="'+(opt.type==="num"?"number":"text")+'"'+
       (opt.type==="num"?' step="any"':'')+' value="'+v+'" placeholder="'+esc(opt.ph||"")+'">';
  }
  if(opt.hint) h+='<div class="hint">'+esc(opt.hint)+'</div>';
  return h+'</div>';
}
function SW(path,titulo,desc){
  return '<div class="sw"><input type="checkbox" data-p="'+path+'" data-t="check"'+(get(path)?" checked":"")+'>'+
    '<div><b>'+esc(titulo)+'</b><small>'+esc(desc||"")+'</small></div></div>';
}
function COTA(t){ return '<div class="cota"><span>'+esc(t)+'</span><i></i></div>'; }
function enlazar(root){
  root.querySelectorAll("[data-p]").forEach(function(el){
    var ev = el.tagName==="SELECT"||el.type==="checkbox" ? "change" : "input";
    el.addEventListener(ev,function(){
      set(el.dataset.p, el.type==="checkbox" ? el.checked : el.value);
      pintarBarra(); pintarChip();
      if(el.type==="checkbox") render();
    });
  });
}

/* --- repetibles --- */
function rep(titulo, arr, campos, path, etiqueta){
  var h='';
  arr.forEach(function(item,i){
    h+='<div class="rep"><div class="rep-h"><span>'+esc(etiqueta)+" "+(i+1)+'</span>'+
       '<button class="btn sm dgr" data-del="'+path+'" data-i="'+i+'">Quitar</button></div><div class="rep-b"><div class="grid">';
    campos.forEach(function(cp){ h+=F(path+"."+i+"."+cp[0], cp[1], cp[2]||{}); });
    h+='</div></div></div>';
  });
  if(!arr.length) h+='<div class="empty">Aún no hay '+esc(etiqueta.toLowerCase())+'. Añade el primero.</div>';
  h+='<div class="btnrow"><button class="btn" data-add="'+path+'">Añadir '+esc(etiqueta.toLowerCase())+'</button></div>';
  return h;
}
function acciones(root){
  root.querySelectorAll("[data-add]").forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.add.split("."), o=S;
      for(var i=0;i<p.length;i++) o=o[p[i]];
      o.push({}); DIRTY=true; render();
    };
  });
  root.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.del.split("."), o=S;
      for(var i=0;i<p.length;i++) o=o[p[i]];
      o.splice(parseInt(b.dataset.i,10),1); DIRTY=true; render();
    };
  });
}

function ficha(){
  var c=calc(), A=revisar(c), L=[];
  function w(s){ L.push(s===undefined?"":s); }
  function kv(k,v,u){ if(v===null||v===undefined||v===""||v==="—") return; w("  "+k+": "+v+(u?" "+u:"")); }
  function num(k,v,u,d){ if(v===null||v===undefined||isNaN(v)) return; w("  "+k+": "+fmt(v,d===undefined?2:d)+(u?" "+u:"")); }

  w("=================================================================");
  w("FICHA DE PROYECTO PARA GENERAR MEMORIA DESCRIPTIVA");
  w("Generada por el artefacto de captura · "+new Date().toLocaleString("es-MX"));
  w("=================================================================");
  w("");
  w("INSTRUCCIONES PARA CLAUDE");
  w("");
  w("Genera la memoria descriptiva del proyecto arquitectónico en un archivo");
  w("Word, con los datos de esta ficha, siguiendo la estructura y el tono del");
  w("documento de referencia de este proyecto (Plutarco Elías Calles 336).");
  w("");
  w("REGLAS DE REDACCIÓN, sin excepción:");
  w("");
  w("1. El documento DESCRIBE. No dictamina, no certifica y no afirma");
  w("   cumplimiento normativo. Quien dictamina es el DRO.");
  w("2. No incluyas el tablero de revisión ni ninguna de las alertas de esta");
  w("   ficha. Son de uso interno.");
  w("3. Tampoco redactes lo contrario: nunca escribas frases que confiesen un");
  w("   incumplimiento ni que expliquen por cuántos centímetros falta algo.");
  w("   Si un dato es problemático, se describe con neutralidad o no se");
  w("   menciona. Ni confesión ni afirmación.");
  w("4. No inventes números de artículo, incisos ni dimensiones mínimas. Si");
  w("   necesitas citar la NTC y no tienes el dato verificado, redacta sin");
  w("   citar y avísame aparte, fuera del documento.");
  w("5. No afirmes que se verificó nada que esta ficha no contenga:");
  w("   estructura, instalaciones, rutas de evacuación, protección civil.");
  w("6. Un solo valor por dato en todo el documento. Si un número aparece en");
  w("   dos secciones, debe ser el mismo.");
  w("7. Cierra con una conclusión descriptiva del proyecto, no con un");
  w("   dictamen de cumplimiento.");
  w("");
  w("Los gráficos te los subo por separado en el chat. Colócalos en la");
  w("sección que indica la lista del final de esta ficha.");
  w("");
  w("=================================================================");
  w("B1 · IDENTIFICACIÓN");
  w("=================================================================");
  var I=S.ident;
  kv("Denominación",I.denominacion); kv("Domicilio",I.calle); kv("Colonia",I.colonia);
  kv("Alcaldía",I.alcaldia); kv("Código postal",I.cp); kv("Propietario",I.propietario);
  kv("DRO",I.dro); kv("Proyectista",I.proyectista); kv("Fecha",I.fecha); kv("Despacho",I.despacho);
  w("");
  w("=================================================================");
  w("B2 · PREDIO");
  w("=================================================================");
  var P=S.predio;
  if(P.fusion){
    w("  EL PREDIO PROVIENE DE UNA FUSIÓN.");
    w("  Incluye una sección de antecedentes de propiedad y fusión antes de");
    w("  las características del predio, con los predios de origen listados.");
    w("  Todos comparten la misma zonificación.");
    w("");
    P.origen.forEach(function(o,i){
      w("  Predio de origen "+(i+1)+":");
      kv("  Domicilio",o.domicilio); num("  Superficie según escritura",n(o.sup),"m²");
      kv("  Escritura pública",o.escritura); kv("  Notario",o.notario);
      kv("  Folio real",o.folio); kv("  Cuenta catastral",o.catastral);
    });
    w("");
    num("Suma de superficies de origen",c.sumaOrigen,"m²");
    kv("Documento que avala la fusión",P.docFusion.tipo||"PENDIENTE POR CONFIRMAR — no lo nombres en el documento");
    kv("Número o folio del documento",P.docFusion.numero);
    kv("Autoridad emisora",P.docFusion.autoridad);
    kv("Fecha",P.docFusion.fecha);
    w("");
  }
  num("Superficie según escritura",c.supEscritura,"m²");
  num("Superficie según levantamiento",c.supLevantamiento,"m²");
  num("SUPERFICIE QUE GOBIERNA EL CÁLCULO",c.supPredio,"m²");
  kv("Forma",P.forma); kv("Número de frentes",P.frentes); kv("Vialidad de frente",P.vialidad);
  kv("Número oficial",P.numOficial); kv("Escritura de compraventa",P.escritura);

    kv("  Fecha",U.pot.fecha); kv("  Predio emisor",U.pot.emisor);

    kv("  ¿Modifica área libre?",U.pot.modAreaLibre?("Sí, "+(U.pot.areaLibreNueva||"?")+"%"):"No");
    kv("  ¿Modifica densidad?",U.pot.modDensidad?("Sí, "+(U.pot.densidadNueva||"?")+" m²/viv"):"No");
  }
  w("");
  w("=================================================================");
  w("COEFICIENTES — YA CALCULADOS, ÚSALOS TAL CUAL");
  w("=================================================================");
  num("COS (área de desplante)",c.cos,"m²");
  num("Área libre requerida",c.areaLibreReq,"m²");
  num("Factor CUS",c.factorCUS,"");
  num("Superficie máxima de construcción base",c.supMaxBase,"m²");

  num("Porcentaje de desplante",c.pctDesplante,"%");

  num("Porcentaje de área libre",c.pctAreaLibre,"%");

  num("Superficie bajo nivel de banqueta",c.supBNB,"m²");
  num("SUPERFICIE TOTAL DE CONSTRUCCIÓN",c.supTotal,"m²");
  w("");
  w("=================================================================");
  w("B4 · NIVELES Y ALTURAS");
  w("=================================================================");
  kv("Nivel de banqueta",S.niveles.banqueta); kv("Pretil o remate",S.niveles.pretil);
  S.niveles.lista.forEach(function(x){
    w("  "+(x.nombre||"Nivel")+" — NPT "+(x.npt||"—")+" m"+
      (x.entrepiso?" · entrepiso "+x.entrepiso+" m":"")+
      (x.libre?" · libre "+x.libre+" m":"")+
      " · habitable "+(x.hab||"0")+" m² · no habitable "+(x.noHab||"0")+" m²"+
      (x.snb?" · sobre banqueta":" · bajo banqueta"));
    if(x.usos) w("      Usos: "+x.usos);
  });
  w("");
  w("=================================================================");
  w("B5 · PROGRAMA DE VIVIENDA");
  w("=================================================================");
  var V=S.viv;
  kv("Total de viviendas",V.total); kv("Recámaras por vivienda",V.recamaras);
  kv("Superficie de vivienda",(V.supMin&&V.supMax)?(V.supMin+" a "+V.supMax+" m²"):"");
  kv("Altura libre",V.alturaLibre?V.alturaLibre+" m":"");
  kv("Ancho mínimo de recámaras",V.anchoRec?V.anchoRec+" m":"");
  kv("Ancho mínimo de otros habitables",V.anchoOtros?V.anchoOtros+" m":"");

  num("Altura de paramento",c.alturaParamento,"m");
  num("Lado mínimo del patio",c.ladoMin,"m");
  num("Lado mínimo con reducción de 1/5",c.ladoReducido,"m");
  num("Dimensión ortogonal exigida para la reducción",c.ortogonalReq,"m");
  c.patios.forEach(function(p){
    w("  "+p.nombre+" ×"+p.cant+" — "+fmt(p.corto)+" × "+fmt(p.largo)+" m"+
      (p.sup?" = "+fmt(p.sup)+" m²":""));
  });
  if(S.patios.cubierta) kv("Cubierta de patios",(S.patios.tipoCubierta||"")+(S.patios.alturaCubierta?", elevada "+S.patios.alturaCubierta+" m sobre pretiles":""));
  w("");
  w("=================================================================");
  w("B7 · ESTACIONAMIENTO");
  w("=================================================================");
  num("Cajones máximos permitidos",c.cajMax,"",0);
  S.estac.niveles.forEach(function(x){
    w("  "+(x.nivel||"Nivel")+": "+((n(x.grandes)||0)+(n(x.chicos)||0))+" cajones · "+
      (x.grandes||0)+" grandes ("+(x.dimG||"—")+") · "+(x.chicos||0)+" chicos ("+(x.dimC||"—")+")");
  });
  num("TOTAL DE CAJONES",c.cajTotal,"",0);
  num("Cajones grandes",c.pctGrandes,"%",2);
  num("Cajones chicos",c.pctChicos,"%",2);
  num("Proporción respecto al máximo permitido",c.ratioCajones,"",2);
  kv("Cajones para personas con discapacidad",S.estac.pcdCant?S.estac.pcdCant+" de "+(S.estac.pcdDim||"—"):"");
  kv("Ángulo del cajón",S.estac.angulo); kv("Ancho de pasillo",S.estac.pasillo?S.estac.pasillo+" m":"");
  kv("Accesos vehiculares",S.estac.accesos);
  S.estac.rampas.forEach(function(r,i){
    w("  Rampa "+(i+1)+(r.nivel?" a "+r.nivel:"")+": "+(r.long||"—")+" m de longitud, "+
      (r.ancho||"—")+" m de ancho"+(r.guarnicion?" más guarniciones de "+r.guarnicion:"")+
      ", pendiente "+(r.pend||"—")+"%");
  });
  w("");
  w("=================================================================");
  w("B8 · CIRCULACIÓN VERTICAL");
  w("=================================================================");
  var E=S.elev;
  kv("Núcleos verticales",E.nucleos);
  kv("ELEVADORES DEL PROYECTO",E.cantidad);
  kv("Escaleras",E.escaleras); kv("Niveles servidos",E.nivelesServidos);
  num("Población de cálculo",c.poblacion,"habitantes",0);
  num("Población a movilizar en 5 min",c.movilizar,"personas",0);
  kv("Capacidad por cabina",E.capCabina?E.capCabina+" personas":"");
  kv("Tiempo de ciclo",E.rtt?E.rtt+" s":""); kv("Intervalo máximo de espera",E.intervalo?E.intervalo+" s":"");
  num("Capacidad por elevador en 5 min",c.capElev,"personas",1);
  num("Elevadores mínimos por cálculo",c.elevMin,"",0);
  w("  Usa un solo número de elevadores en todo el documento: el de arriba.");
  w("");
  w("=================================================================");
  w("B9 · ÁREAS COMUNES Y SERVICIOS");
  w("=================================================================");
  var K=S.comunes;
  kv("Control de acceso",K.control); kv("Amenidades",K.amenidades); kv("Servicios",K.servicios);
  kv("Áreas técnicas",K.tecnicas); kv("Bodegas",K.bodegas);
  kv("Cuarto de basura",K.basura); kv("Biciestacionamientos",K.bici);
  w("");
  w("=================================================================");
  w("GRÁFICOS — te los subo por separado");
  w("=================================================================");
  S.graficos.forEach(function(g){
    if(g.estado==="No aplica") return;
    w("  ["+(g.estado==="Listo"?"adjunto":"pendiente")+"] "+g.nombre+" → "+g.seccion+
      (g.pie?" · pie: "+g.pie:""));
  });
  w("");
  w("=================================================================");
  w("PENDIENTES POR CONFIRMAR — recuérdamelos si te pregunto");
  w("=================================================================");
  var pend=[];
  if(S.predio.fusion && !S.predio.docFusion.tipo) pend.push("Nombre exacto del documento que avala la fusión de predios");
  if(S.suelo.pot.activo && !S.suelo.pot.instrumento) pend.push("Instrumento normativo del potencial adquirido");
  if(!S.suelo.densidadM2) pend.push("m² de terreno por vivienda que aplican a este predio");
  pend.push("Verificar artículos, incisos y mínimos dimensionales contra la NTC-Proyecto Arquitectónico vigente (edición de diciembre de 2024)");
  if(S.pendientes) pend.push(S.pendientes);
  pend.forEach(function(p,i){ w("  "+(i+1)+". "+p); });
  var nr=A.filter(function(x){return x.l==="r"}).length;
  if(nr){
    w("");
    w("  Nota interna: el tablero marca "+nr+" punto"+(nr>1?"s":"")+" en rojo.");
    w("  Genera el documento igual. No los menciones en el texto.");
  }
  w("");
  w("=================================================================");
  w("FIN DE LA FICHA");
  w("=================================================================");
  return L.join("\n");
}

     '<button class="btn" id="bsel">Seleccionar todo</button></div>';

     '<div class="f">'+F("pendientes","Pendientes propios de este proyecto",{wide:true,type:"area",
       ph:"Lo que escribas aquí se imprime al final de la ficha"})+'</div>';
