<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Captura de variables · Memoria descriptiva CDMX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232F7D6B'/><text x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23ffffff' text-anchor='middle'>M</text></svg>">
</head>
<body>

<style>
  html,body{margin:0;padding:0;background:#F3F6F4}
  .mdapp{
    --pap:#F3F6F4;
    --sup:#FFFFFF;
    --ink:#182724;
    --ink2:#4E635E;
    --ink3:#8FA29D;
    --acc:#2F7D6B;
    --acc-d:#245F51;
    --acc-s:#E4EFEB;
    --line:#E2E9E6;
    --r:#C0483C; --r-s:#FAEDEB;
    --am:#9A6B12; --am-s:#FBF3E4;
    --vd:#2F7D6B; --vd-s:#E4EFEB;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .mdapp *{box-sizing:border-box}
  .mdapp{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.5;
    background:var(--pap);
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 3px);
    padding:0 0 24px;-webkit-font-smoothing:antialiased}
  .mdapp button{font-family:inherit}

  /* ---- encabezado ---- */
  .hd{padding:22px 26px 18px;display:flex;justify-content:space-between;align-items:flex-end;
    gap:16px;flex-wrap:wrap}
  .hd h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.2}
  .hd p{margin:4px 0 0;font-size:10.5px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase}
  .chip{background:var(--sup);border:1px solid var(--line);border-radius:999px;padding:7px 16px;
    font-size:12px;color:var(--acc);font-weight:600;white-space:nowrap;
    box-shadow:0 1px 2px rgba(24,39,36,.04)}

  /* ---- estructura ---- */
  .shell{display:grid;grid-template-columns:210px 1fr;gap:18px;padding:0 26px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:8px}
  .rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:0;padding:9px 13px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:13px}
  .rail button:hover{background:rgba(255,255,255,.7)}
  .rail button.on{background:var(--acc-s);color:var(--acc);font-weight:600}
  .rail button .dot{width:5px;height:5px;border-radius:50%;background:transparent;flex:0 0 auto}
  .rail button.on .dot{background:var(--acc)}
  .rail .grp{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
    padding:15px 13px 6px;font-weight:600}
  .pane{background:var(--sup);border-radius:16px;padding:26px 28px 28px;min-width:0;
    box-shadow:0 1px 2px rgba(24,39,36,.05),0 14px 34px -22px rgba(24,39,36,.35)}
  .pane h2{font-size:19px;margin:0;font-weight:600;letter-spacing:-.02em}
  .pane .sub{color:var(--ink3);font-size:12.5px;margin:5px 0 0;line-height:1.5}

  /* ---- rótulo de sección ---- */
  .cota{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
  .cota span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
    font-weight:600;white-space:nowrap}
  .cota i{flex:1;height:1px;background:var(--line)}

  /* ---- campos ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:18px 22px;margin-top:20px}
  .f label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink3);font-weight:600;margin-bottom:5px}
  .f input,.f select,.f textarea{width:100%;border:0;border-bottom:1.5px solid var(--line);
    background:transparent;padding:5px 0 7px;font-family:var(--sans);font-size:15px;color:var(--ink);
    border-radius:0}
  .f input[type=number]{font-family:var(--mono);font-size:14px}
  .f select{padding-left:0}
  .f input:focus,.f select:focus,.f textarea:focus{outline:0;border-bottom-color:var(--acc);
    box-shadow:0 1px 0 var(--acc)}
  .f input::placeholder,.f textarea::placeholder{color:#BECBC7}
  .f .hint{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.4}
  .f textarea{min-height:52px;resize:vertical;line-height:1.5}
  .wide{grid-column:1/-1}
  .sw{display:flex;align-items:center;gap:14px;background:var(--acc-s);border-radius:12px;
    padding:15px 18px;margin-top:24px;cursor:pointer}
  .sw input{width:18px;height:18px;accent-color:var(--acc);flex:0 0 auto;margin:0}
  .sw b{display:block;font-size:13.5px;font-weight:600}
  .sw small{color:var(--ink2);font-size:11.5px;display:block;margin-top:2px;line-height:1.4}
  .sw.mini{background:rgba(243,246,244,.9);padding:11px 15px;margin-top:10px}

  /* ---- combo: lista de respuestas frecuentes con salida a escribir otra ---- */
  .combo{display:flex;align-items:center;gap:6px}
  .combo select,.combo input{flex:1;min-width:0}
  .combo .c-back{border:0;background:none;color:var(--ink3);cursor:pointer;padding:2px 4px;
    font-size:15px;line-height:1;border-radius:6px;flex:0 0 auto}
  .combo .c-back:hover{color:var(--acc);background:var(--acc-s)}
  .combo [hidden]{display:none}

  /* ---- fichas de selección múltiple ---- */
  .chips{border-bottom:1.5px solid var(--line);padding:3px 0 7px;display:flex;flex-wrap:wrap;
    gap:6px;align-items:center}
  .chips:focus-within{border-bottom-color:var(--acc)}
  .chips .ch{display:inline-flex;align-items:center;gap:5px;background:var(--acc-s);
    color:var(--acc-d);border-radius:999px;padding:4px 5px 4px 12px;font-size:12.5px;line-height:1.25}
  .chips .ch button{border:0;background:none;color:var(--acc);cursor:pointer;font-size:13px;
    line-height:1;padding:2px 4px;border-radius:50%;font-family:inherit}
  .chips .ch button:hover{background:rgba(47,125,107,.2)}
  .chips select,.chips input{flex:1;min-width:130px;border:0;border-bottom:0;background:transparent;
    padding:4px 0;font-size:13.5px}
  .chips select{color:var(--ink3)}
  .chips select:focus,.chips input:focus{outline:0;box-shadow:none;border-bottom:0}
  .chips .vacio{color:#BECBC7;font-size:13px}

  /* ---- repetibles ---- */
  .rep{background:var(--pap);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .rep-h{display:flex;justify-content:space-between;align-items:center;padding:9px 16px}
  .rep-h span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
  .rep-b{padding:2px 16px 18px}
  .rep-b .grid{margin-top:8px;gap:16px 20px}
  .btn{border:1px solid var(--line);background:var(--sup);padding:8px 17px;font-size:12.5px;
    cursor:pointer;color:var(--ink2);border-radius:999px}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.pri:hover{background:var(--acc-d);color:#fff}
  .btn.dgr{color:var(--r);border-color:transparent;background:transparent}
  .btn.dgr:hover{border-color:var(--r);color:var(--r)}
  .btn.sm{padding:4px 12px;font-size:11.5px}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}

  /* ---- imagen de un gráfico ---- */
  .img{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0 4px}
  .img img{width:120px;height:auto;max-height:86px;object-fit:contain;border-radius:6px;
    border:1px solid var(--line);background:#fff;flex:0 0 auto}
  .img-d{flex:1;min-width:150px}
  .img-d b{font-size:12.5px;font-weight:600;display:block;word-break:break-all}
  .img-d small{display:block;color:var(--ink3);font-family:var(--mono);font-size:10.5px;margin-top:2px}
  .img-d small.av{color:var(--am);font-family:var(--sans);font-size:11px}
  .img-no{flex:1;min-width:150px;color:var(--ink3);font-size:12.5px;font-style:italic}
  .btn.subir{display:inline-block;flex:0 0 auto}
  .btn.subir:hover{border-color:var(--acc);color:var(--acc)}

  /* ---- tablero ---- */
  .chk{display:flex;gap:12px;padding:13px 16px;border-radius:12px;margin-bottom:8px;align-items:flex-start}
  .chk.r{background:var(--r-s)} .chk.a{background:var(--am-s)} .chk.v{background:var(--vd-s)}
  .pip{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .pip.r{background:var(--r)}.pip.a{background:var(--am)}.pip.v{background:var(--vd)}
  .chk b{font-size:12.5px;display:block;font-weight:600}
  .chk .val{font-family:var(--mono);font-size:12px;color:var(--ink2);display:block;margin-top:1px}
  .chk small{color:var(--ink2);font-size:11.5px;display:block;margin-top:3px;line-height:1.4}
  .tally{display:flex;gap:9px;margin:18px 0 16px;flex-wrap:wrap}
  .tally div{font-size:11.5px;padding:6px 15px;border-radius:999px;font-weight:600}
  .tally .r{background:var(--r-s);color:var(--r)}
  .tally .a{background:var(--am-s);color:var(--am)}
  .tally .v{background:var(--vd-s);color:var(--vd)}

  table.calc{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
  table.calc th{text-align:left;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink3);border-bottom:1px solid var(--line);padding:0 10px 7px 0;font-weight:600}
  table.calc td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
  table.calc td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
  table.calc td.c{font-family:var(--mono);color:var(--ink3);font-size:10.5px;width:46px}

  /* ---- proyectos ---- */
  .pitem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;
    background:var(--pap);border-radius:12px;margin-bottom:8px}
  .pitem.on{background:var(--acc-s)}
  .pitem b{font-size:14px;font-weight:600}
  .pitem small{color:var(--ink3);font-family:var(--mono);font-size:10.5px;display:block;margin-top:2px}
  .empty{padding:30px 18px;text-align:center;color:var(--ink3);font-size:12.5px;
    background:var(--pap);border-radius:12px}

  /* ---- ficha y respaldo ---- */
  .ficha{width:100%;height:380px;font-family:var(--mono);font-size:11px;line-height:1.6;
    border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--pap);
    color:var(--ink);resize:vertical}
  .note{background:var(--acc-s);border-radius:12px;padding:13px 17px;font-size:12.5px;
    margin:14px 0;line-height:1.5}
  .note.warn{background:var(--am-s)}
  .note.dgr{background:var(--r-s)}

  /* ---- barra ---- */
  .bar{margin:20px 26px 0;background:var(--sup);border-radius:16px;padding:16px 24px;
    display:flex;gap:32px;flex-wrap:wrap;align-items:center;position:sticky;bottom:10px;
    box-shadow:0 1px 2px rgba(24,39,36,.05),0 14px 34px -20px rgba(24,39,36,.45)}
  .cell .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
    font-weight:600;display:block}
  .cell .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px;display:block}
  .cell .v .u{font-size:11px;color:var(--ink3);font-weight:500;margin-left:3px}
  .cell .v.r{color:var(--r)}.cell .v.a{color:var(--am)}.cell .v.v{color:var(--vd)}
  .sp{flex:1}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:#fff;padding:11px 20px;font-size:12.5px;border-radius:999px;z-index:99;opacity:0;
    transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px -10px rgba(24,39,36,.5)}
  .toast.on{opacity:1}

  @media(max-width:760px){
    .shell{grid-template-columns:1fr;padding:0 14px;gap:12px}
    .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
    .rail button{width:auto;white-space:nowrap}
    .rail .grp{display:none}
    .pane{padding:20px 18px 22px}
    .hd{padding:18px 16px 14px}
    .bar{margin:16px 14px 0;padding:14px 18px;gap:20px}
  }
  @media(prefers-reduced-motion:reduce){.mdapp *{transition:none!important}}
</style>

<div class="mdapp">
  <div class="hd">
    <div>
      <h1>Captura de variables</h1>
      <p id="ver">Memoria descriptiva · Vivienda plurifamiliar CDMX</p>
    </div>
    <div class="chip" id="chip">Sin proyecto abierto</div>
  </div>

  <div id="aviso"></div>

  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main class="pane" id="pane"></main>
  </div>

  <div class="bar" id="bar"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
"use strict";

var S = null, IDX = [], VIEW = "proy", DIRTY = false;

/* Versión visible en el encabezado y en la sección Respaldo.
   Al publicar cualquier cambio hay que subirla AQUÍ, en un solo lugar: es lo
   único que permite saber de un vistazo si el navegador está sirviendo una
   copia vieja de su caché en lugar de la recién publicada.                   */
var VERSION = "2.5";
var VERSION_FECHA = "14 ago 2026";

var BORRAR_ID = null;     /* proyecto con la eliminación pendiente de confirmar */
var RENOMBRAR_ID = null;  /* proyecto cuyo renglón está en modo edición        */
var VACIAR_CAT = null;    /* categoría del catálogo pendiente de confirmar     */

function nuevoProyecto(nombre){
  return {
    id: "p" + Date.now(),
    nombre: nombre || "Proyecto sin nombre",
    actualizado: new Date().toISOString(),
    ident:{denominacion:"",calle:"",colonia:"",alcaldia:"",cp:"",propietario:"",dro:"",proyectista:"",fecha:"",despacho:""},
    predio:{fusion:false, origen:[], docFusion:{tipo:"",numero:"",autoridad:"",fecha:""},
      supEscritura:"", supLevantamiento:"", forma:"Rectangular", frentes:"1", vialidad:"",
      numOficial:"", escritura:"", linderos:[], cuentaCatastral:"", alineamiento:""},
    suelo:{folio:"", fecha:"", clave:"", claveManual:false, usoClave:"", uso:"",
      niveles:"", areaLibre:"", densidad:"", densidadM2:"", norma:"",
      pot:{activo:false, instrumento:"", folio:"", autoridad:"", fecha:"", m2:"", emisor:"",
        modNiveles:false, nivelesExtra:"", modAreaLibre:false, areaLibreNueva:"", modDensidad:false, densidadNueva:""}},
    niveles:{banqueta:"0.00", pretil:"", lista:[]},
    /* texto propio por nivel: si está vacío, el documento arma el párrafo
       con los usos capturados; si lleva algo, manda el del usuario (§17.5) */
    viv:{total:"", porNivel:[], protos:[], supMin:"", supMax:"", prototipos:"", locales:"", recamaras:"",
      alturaLibre:"", anchoRec:"", anchoOtros:"", anchoEstancia:""},
    patios:{nptHab:"", nivelParamento:"", cubierta:false, tipoCubierta:"", alturaCubierta:"", lista:[]},
    estac:{niveles:[], rampas:[], pcdCant:"", pcdDim:"", angulo:"90", pasillo:"", accesos:"", maxPorViv:"3"},
    elev:{nucleos:"", cantidad:"", nivelesServidos:"", capCabina:"10", rtt:"90", pctDiseno:"10",
      intervalo:"60", ocupRec:"2", adicional:"1", escaleras:""},
    comunes:{control:"", amenidades:"", servicios:"", tecnicas:"", bodegas:"", bici:"", basura:""},
    graficos:[], pendientes:""
  };
}

var GRAFICOS_BASE = [
  ["Croquis de ubicación","1.1 Características del predio",true],
  ["Plano de la fusión de predios","1.2 Antecedentes de propiedad y fusión",false],
  ["Recorte del PDDU","1.3 Uso de suelo",true],
  ["Tabla de densidades","1.3 Uso de suelo",false],
  ["Simbología de suelo urbano","1.3 Uso de suelo",false],
  ["Tabla de ocupación del suelo (COS)","1.4 COS",true],
  ["Tabla de utilización del suelo (CUS)","1.5 CUS",true],
  ["Tabla de superficies por nivel","1.5 CUS",true],
  ["Diagrama de niveles y superficies","1.5 CUS",false],
  ["Planta arquitectónica de semisótano","2.1 Descripción por niveles",true],
  ["Planta arquitectónica de planta baja","2.2 Descripción por niveles",true],
  ["Planta arquitectónica de nivel tipo","2.3 Descripción por niveles",true],
  ["Planta de azotea","2.4 Azotea y techos",true],
  ["Detalle de cubierta en azotea","2.4 Azotea y techos",false],
  ["Corte arquitectónico transversal","2.5 Alturas",true],
  ["Esquema de patio mínimo normativo","2.6 Cálculo de patios",true],
  ["Esquema de patio tipo del proyecto","2.6 Cálculo de patios",true],
  ["Esquema de patio posterior","2.6 Cálculo de patios",false]
];
/* Identificador estable de cada gráfico. Hace falta porque su imagen vive
   fuera del proyecto, en IndexedDB, y la posición en la lista no sirve de
   clave: al quitar un renglón se desplazarían todas las siguientes y cada
   gráfico acabaría con la imagen de otro.                                 */
function idGrafico(){
  return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function normalizarGraficos(p){
  var cambio=false;
  (p.graficos||[]).forEach(function(g){ if(!g.gid){ g.gid=idGrafico(); cambio=true; } });
  return cambio;
}
function graficosIniciales(){
  return GRAFICOS_BASE.map(function(g,i){
    return {id:i+1, gid:idGrafico(), nombre:g[0], seccion:g[1],
            obligatorio:g[2], estado:"Pendiente"};
  });
}

/* ================= ALMACENAMIENTO =================
   Dentro de un artifact de Claude existe window.storage. Fuera de él
   (GitHub Pages o archivo local) no existe, y se usa localStorage con la
   misma interfaz asíncrona. Las claves son idénticas en los dos casos, así
   que un respaldo exportado en un entorno se restaura en el otro.          */
var SIN_ALMACEN = false;
var storage = (function(){
  if(window.storage && typeof window.storage.get === "function") return window.storage;
  var ls = null;
  try{
    ls = window.localStorage;
    ls.setItem("mem:sonda","1"); ls.removeItem("mem:sonda");
  }catch(e){ ls = null; }
  if(!ls){
    SIN_ALMACEN = true;
    var no = function(){ return Promise.reject(new Error("almacenamiento bloqueado")); };
    return {get:no, set:no, delete:no, list:no};
  }
  /* Todas las páginas publicadas bajo el mismo usuario de GitHub Pages comparten
     el origen <usuario>.github.io y, con él, un solo localStorage: la carpeta del
     repositorio no aísla nada. El prefijo mantiene estos datos separados de los de
     cualquier otra aplicación publicada en el mismo dominio.                      */
  var PFX = "memdesc:";
  try{
    if(ls.getItem("mem:index")!==null && ls.getItem(PFX+"mem:index")===null){
      var viejas=[];
      for(var j=0;j<ls.length;j++){ var k=ls.key(j); if(k && k.indexOf("mem:")===0) viejas.push(k); }
      viejas.forEach(function(k){ ls.setItem(PFX+k, ls.getItem(k)); ls.removeItem(k); });
    }
  }catch(e){}
  return {
    get: function(k){
      var v = ls.getItem(PFX+k);
      return v===null ? Promise.reject(new Error("no encontrado")) : Promise.resolve({value:v});
    },
    set: function(k,v){
      try{ ls.setItem(PFX+k,v); }catch(e){ return Promise.reject(e); }
      return Promise.resolve({});
    },
    delete: function(k){ ls.removeItem(PFX+k); return Promise.resolve({}); },
    list: function(){
      var ks=[];
      for(var i=0;i<ls.length;i++){
        var k=ls.key(i);
        if(k && k.indexOf(PFX)===0) ks.push(k.slice(PFX.length));
      }
      return Promise.resolve({keys:ks});
    }
  };
})();
function fallaGuardado(e){
  if(SIN_ALMACEN) return "Este navegador tiene bloqueado el almacenamiento. Sal del modo incógnito o permite los datos de sitio";
  if(e && (e.name==="QuotaExceededError" || e.code===22 || e.code===1014))
    return "Se llenó el espacio del navegador. Descarga un respaldo y elimina proyectos que ya no uses";
  return "No se pudo guardar. Inténtalo otra vez";
}
async function cargarIndice(){
  try{ var r = await storage.get("mem:index"); IDX = r && r.value ? JSON.parse(r.value) : []; }
  catch(e){ IDX = []; }
}
async function guardarIndice(){
  try{ await storage.set("mem:index", JSON.stringify(IDX)); }
  catch(e){ toast(fallaGuardado(e)); }
}
async function guardar(silencio){
  if(!S) return;
  S.actualizado = new Date().toISOString();
  try{
    await storage.set("mem:proj:"+S.id, JSON.stringify(S));
    var i = IDX.findIndex(function(x){return x.id===S.id});
    var meta = {id:S.id, nombre:S.nombre, actualizado:S.actualizado};
    if(i>=0) IDX[i]=meta; else IDX.unshift(meta);
    await guardarIndice(); DIRTY=false;
    if(!silencio) toast("Proyecto guardado");
    pintarChip();
  }catch(e){ toast(fallaGuardado(e)); }
}
/* Rellena las claves que falten desde nuevoProyecto(), a cualquier
   profundidad: al añadir un campo nuevo basta con declararlo allí y los
   proyectos guardados antes se migran solos al abrirse. Las listas no se
   tocan — sus renglones son datos del usuario, no estructura.            */
function esObjeto(x){ return x && typeof x==="object" && !Array.isArray(x); }
function rellenar(destino, base){
  for(var k in base){
    if(!(k in destino) || destino[k]===null || destino[k]===undefined) destino[k]=base[k];
    else if(esObjeto(base[k]) && esObjeto(destino[k])) rellenar(destino[k], base[k]);
  }
  return destino;
}
function migrar(p){
  rellenar(p, nuevoProyecto());
  if(!p.graficos || !p.graficos.length) p.graficos = graficosIniciales();
  normalizarGraficos(p);
  /* La zonificación pasó de texto libre a clave compuesta por partes. Un
     proyecto capturado antes conserva su texto y se marca como escrito a
     mano, para no perderlo ni recomponerlo mal.                          */
  if(p.suelo && p.suelo.clave && !p.suelo.usoClave) p.suelo.claveManual = true;
  return p;
}
async function abrir(id){
  try{
    var r = await storage.get("mem:proj:"+id);
    S = migrar(JSON.parse(r.value)); VIEW="ident"; render();
    /* Las imágenes viven aparte y se leen después: la captura no tiene por
       qué esperar a IndexedDB para pintarse.                              */
    await cargarImagenes(S.id);
    if(VIEW==="gra") render();
  }catch(e){ toast("No se pudo abrir el proyecto"); }
}
/* Renombrar desde la lista. Sin prompt(), por la misma razón que no se usa
   confirm(): bloquea la página y no está en todos los entornos.          */
async function renombrar(id, nombre){
  nombre = String(nombre||"").trim();
  if(!nombre){ toast("El nombre no puede quedar vacío"); return; }
  try{
    if(S && S.id===id){ S.nombre=nombre; await guardar(true); }
    else{
      var r = await storage.get("mem:proj:"+id);
      var p = JSON.parse(r.value); p.nombre = nombre;
      await storage.set("mem:proj:"+id, JSON.stringify(p));
      var i = IDX.findIndex(function(x){return x.id===id});
      if(i>=0) IDX[i].nombre = nombre;
      await guardarIndice();
    }
    RENOMBRAR_ID=null; render(); toast("Proyecto renombrado");
  }catch(e){ toast(fallaGuardado(e)); }
}
async function borrar(id){
  try{
    await storage.delete("mem:proj:"+id);
    await borrarImagenesDe(id);
    IDX = IDX.filter(function(x){return x.id!==id});
    await guardarIndice();
    if(S && S.id===id){ S=null; IMGS={}; VIEW="proy"; }
    render(); toast("Proyecto eliminado");
  }catch(e){ toast("No se pudo eliminar el proyecto"); }
}

/* ================= CATÁLOGO DE RESPUESTAS FRECUENTES =================
   Vive en su propia clave, fuera de mem:proj:<id>: el catálogo es del
   usuario, no de la memoria. Si viviera dentro del proyecto, cada proyecto
   nuevo nacería con la lista vacía y no ahorraría nada.
   Entra al respaldo, para que al cambiar de máquina no se pierda.        */
var CAT = {};
async function cargarCatalogo(){
  try{ var r = await storage.get("mem:catalogo"); CAT = r && r.value ? JSON.parse(r.value) : {}; }
  catch(e){ CAT = {}; }
}
function guardarCatalogo(){
  storage.set("mem:catalogo", JSON.stringify(CAT)).catch(function(e){
    toast("No se pudo guardar el catálogo. "+fallaGuardado(e));
  });
}
/* Añade un valor escrito a mano a la lista de su campo, para la próxima vez.
   El fallo al guardar se ignora a propósito: el catálogo es una comodidad y
   nunca debe robarle el aviso a un fallo de guardado del proyecto.        */
function recordar(cat,val){
  val = String(val===null||val===undefined?"":val).trim();
  if(!cat || val.length<2) return;
  /* Lo que ya viene precargado no se copia al catálogo personal: solo se
     guarda lo que el usuario escribió y la lista no traía.               */
  if(LISTAS[cat] && LISTAS[cat].indexOf(val)>=0) return;
  if(!CAT[cat]) CAT[cat]=[];
  var hay = CAT[cat].some(function(x){ return String(x).toLowerCase()===val.toLowerCase(); });
  if(hay) return;
  CAT[cat].push(val);
  CAT[cat].sort(function(a,b){ return String(a).localeCompare(String(b),"es"); });
  guardarCatalogo();
}
/* Borrar del catálogo no toca ningún proyecto: la respuesta deja de
   proponerse, pero donde ya se usó sigue escrita. Por eso basta un clic y
   no hace falta la confirmación en dos pasos de las acciones destructivas. */
function olvidar(cat,i){
  if(!CAT[cat]) return;
  CAT[cat].splice(i,1);
  if(!CAT[cat].length) delete CAT[cat];
  guardarCatalogo();
}
function vaciarCategoria(cat){
  delete CAT[cat];
  guardarCatalogo();
}
function cuentaCatalogo(){
  var t=0; for(var k in CAT) if(CAT[k]) t+=CAT[k].length;
  return t;
}

/* ================= IMÁGENES DE LOS GRÁFICOS =================
   Las imágenes NO caben en localStorage: son 5 MB por origen, compartidos
   con las demás aplicaciones publicadas en el mismo dominio, y quince
   gráficos comprimidos pesan varios MB. Van a IndexedDB, por proyecto.

   Consecuencia que la interfaz tiene que decir en voz alta: el respaldo
   JSON sigue siendo ligero y NO las incluye. Al restaurar un respaldo en
   otra máquina el proyecto abre completo, pero sin gráficos.

   Dos almacenes a propósito: «meta» es pequeño y se lee entero al abrir el
   proyecto, para pintar la pantalla; «bytes» solo se toca al generar el
   documento. Así abrir un proyecto no se trae varios MB a la memoria.     */
var SIN_IMAGENES = false;
var BD = null;
var IMGS = {};          /* meta de las imágenes del proyecto abierto */

function abrirBD(){
  if(BD) return Promise.resolve(BD);
  return new Promise(function(res,rej){
    var idb = window.indexedDB;
    if(!idb){ SIN_IMAGENES=true; return rej(new Error("sin IndexedDB")); }
    var p;
    try{ p = idb.open("memdesc-img", 1); }
    catch(e){ SIN_IMAGENES=true; return rej(e); }
    p.onupgradeneeded = function(){
      var db = p.result;
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      if(!db.objectStoreNames.contains("bytes")) db.createObjectStore("bytes");
    };
    p.onsuccess = function(){ BD = p.result; res(BD); };
    p.onerror = function(){ SIN_IMAGENES=true; rej(p.error || new Error("no abrió")); };
    p.onblocked = function(){ SIN_IMAGENES=true; rej(new Error("bloqueada")); };
  });
}
function claveImg(proyId, gid){ return proyId + "|" + gid; }

function guardarImagen(gid, meta, bytes){
  var k = claveImg(S.id, gid);
  return abrirBD().then(function(db){
    return new Promise(function(res,rej){
      var t = db.transaction(["meta","bytes"],"readwrite");
      t.objectStore("meta").put(meta, k);
      t.objectStore("bytes").put(bytes, k);
      t.oncomplete = function(){ IMGS[gid]=meta; res(); };
      t.onerror = function(){ rej(t.error); };
      t.onabort = function(){ rej(t.error || new Error("cancelada")); };
    });
  });
}
function borrarImagen(gid){
  var k = claveImg(S.id, gid);
  return abrirBD().then(function(db){
    return new Promise(function(res,rej){
      var t = db.transaction(["meta","bytes"],"readwrite");
      t.objectStore("meta").delete(k);
      t.objectStore("bytes").delete(k);
      t.oncomplete = function(){ delete IMGS[gid]; res(); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function leerImagenBytes(proyId, gid){
  return abrirBD().then(function(db){
    return new Promise(function(res,rej){
      var t = db.transaction(["bytes"],"readonly");
      var r = t.objectStore("bytes").get(claveImg(proyId,gid));
      r.onsuccess = function(){ res(r.result || null); };
      r.onerror = function(){ rej(r.error); };
    });
  });
}
/* Toda la meta del proyecto abierto, para pintar la pantalla de gráficos. */
function cargarImagenes(proyId){
  IMGS = {};
  return abrirBD().then(function(db){
    return new Promise(function(res){
      var t = db.transaction(["meta"],"readonly");
      var cur = t.objectStore("meta").openCursor();
      cur.onsuccess = function(){
        var c = cur.result;
        if(!c) return res(IMGS);
        var k = String(c.key);
        if(k.indexOf(proyId+"|")===0) IMGS[k.slice(proyId.length+1)] = c.value;
        c.continue();
      };
      cur.onerror = function(){ res(IMGS); };
    });
  }).catch(function(){ return IMGS; });
}
/* Al eliminar un proyecto se van también sus imágenes: si no, quedarían
   ocupando espacio para siempre, sin nada que las nombre.                 */
function borrarImagenesDe(proyId){
  return abrirBD().then(function(db){
    return new Promise(function(res){
      var t = db.transaction(["meta","bytes"],"readwrite");
      var m = t.objectStore("meta"), b = t.objectStore("bytes");
      var cur = m.openCursor();
      cur.onsuccess = function(){
        var c = cur.result;
        if(!c) return;
        var k = String(c.key);
        if(k.indexOf(proyId+"|")===0){ m.delete(c.key); b.delete(c.key); }
        c.continue();
      };
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ res(); };
    });
  }).catch(function(){});
}

/* ---- recompresión en el navegador ----
   Los archivos que salen de un CAD pesan decenas de MB. Word los recomprimía
   sin avisar; aquí hay que hacerlo a mano o el .docx sale de 80 MB.

   Se guarda en los dos formatos y se conserva el más ligero. No hay
   heurística que adivinar: en una planta con mucho trazo gana el JPEG, y en
   un esquema de pocos colores planos gana el PNG, que además ahí se ve
   mejor. Medido sobre los planos reales del Moras 330.

   1400 px de ancho son ~220 ppp sobre el ancho útil del marco, que es la
   resolución a la que Word dejó los gráficos del documento de David.      */
var ANCHO_MAX_IMG = 1400;
var CALIDAD_JPEG = 0.88;

function recomprimir(archivo){
  return new Promise(function(res,rej){
    var url;
    try{ url = URL.createObjectURL(archivo); }
    catch(e){ return rej(new Error("No se pudo leer el archivo.")); }
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h) return rej(new Error("La imagen no tiene dimensiones legibles."));
      if(w > ANCHO_MAX_IMG){ h = Math.round(h*ANCHO_MAX_IMG/w); w = ANCHO_MAX_IMG; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      var g = c.getContext("2d");
      /* Un PNG con transparencia quedaría negro en Word: fondo blanco. */
      g.fillStyle = "#FFFFFF"; g.fillRect(0,0,w,h);
      g.drawImage(img,0,0,w,h);

      var mw = 260, mh = Math.max(1, Math.round(h*mw/w));
      var mc = document.createElement("canvas");
      mc.width = mw; mc.height = mh;
      var mg = mc.getContext("2d");
      mg.fillStyle = "#FFFFFF"; mg.fillRect(0,0,mw,mh);
      mg.drawImage(img,0,0,mw,mh);
      var mini = mc.toDataURL("image/jpeg",0.7);

      function aBlob(tipo,q){
        return new Promise(function(ok){ c.toBlob(ok, tipo, q); });
      }
      Promise.all([aBlob("image/jpeg",CALIDAD_JPEG), aBlob("image/png")])
        .then(function(bs){
          var bj=bs[0], bp=bs[1];
          var elegido, tipo;
          if(bj && bp){ if(bp.size < bj.size){ elegido=bp; tipo="png"; }
                        else { elegido=bj; tipo="jpeg"; } }
          else if(bj){ elegido=bj; tipo="jpeg"; }
          else if(bp){ elegido=bp; tipo="png"; }
          else return rej(new Error("No se pudo comprimir la imagen."));
          return elegido.arrayBuffer().then(function(ab){
            res({bytes:new Uint8Array(ab), tipo:tipo, w:w, h:h,
                 peso:ab.byteLength, miniatura:mini, aviso:null});
          });
        }, rej);
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      rej(new Error("Este navegador no sabe leer ese formato. Exporta el plano como PNG o JPG."));
    };
    img.src = url;
  });
}
function pesoLegible(b){
  if(b===null||b===undefined) return "—";
  if(b < 1024) return b+" B";
  if(b < 1024*1024) return (b/1024).toFixed(0)+" KB";
  return (b/1024/1024).toFixed(1)+" MB";
}

/* ================= RESPALDO ================= */
async function exportarTodo(){
  var out = {formato:"memoria-descriptiva-cdmx", version:2, app:VERSION,
    generado:new Date().toISOString(), catalogo:CAT, proyectos:[]};
  for(var i=0;i<IDX.length;i++){
    try{
      var r = await storage.get("mem:proj:"+IDX[i].id);
      if(r && r.value) out.proyectos.push(JSON.parse(r.value));
    }catch(e){}
  }
  return JSON.stringify(out, null, 2);
}
function exportarUno(){
  return JSON.stringify({formato:"memoria-descriptiva-cdmx", version:2, app:VERSION,
    generado:new Date().toISOString(), catalogo:CAT, proyectos:[S]}, null, 2);
}
async function importar(texto){
  var d;
  try{ d = JSON.parse(texto); }
  catch(e){ throw new Error("El texto no es un respaldo válido: no se pudo leer como JSON"); }
  if(!d || !Array.isArray(d.proyectos)) throw new Error("El archivo no contiene una lista de proyectos");
  /* El catálogo se suma al que ya hay: importar nunca destruye, tampoco aquí. */
  if(d.catalogo && typeof d.catalogo==="object"){
    for(var ck in d.catalogo){
      if(Array.isArray(d.catalogo[ck])) d.catalogo[ck].forEach(function(v){ recordar(ck,v); });
    }
  }
  var nuevos=0, copias=0;
  for(var i=0;i<d.proyectos.length;i++){
    var p = migrar(d.proyectos[i]);
    if(!p.id) p.id = "p"+Date.now()+"-"+i;
    if(IDX.some(function(x){return x.id===p.id})){
      p.id = "p"+Date.now()+"-"+i; p.nombre = p.nombre + " (importado)"; copias++;
    } else nuevos++;
    p.actualizado = p.actualizado || new Date().toISOString();
    await storage.set("mem:proj:"+p.id, JSON.stringify(p));
    IDX.unshift({id:p.id, nombre:p.nombre, actualizado:p.actualizado});
  }
  await guardarIndice();
  return {nuevos:nuevos, copias:copias};
}
function descargar(nombre, texto){
  try{
    var blob = new Blob([texto], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 200);
    return true;
  }catch(e){ return false; }
}
function fechaArchivo(){
  var d=new Date(), p=function(x){return String(x).padStart(2,"0")};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes());
}

/* ================= UTILIDADES ================= */
function n(v){ var x=parseFloat(String(v).replace(/,/g,"")); return isNaN(x)?null:x; }
function fmt(v,d){ if(v===null||v===undefined||isNaN(v)) return "—";
  return Number(v).toLocaleString("es-MX",{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d}); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function get(path){ var o=S,p=path.split("."); for(var i=0;i<p.length;i++){ if(o===undefined||o===null) return ""; o=o[p[i]]; } return o===undefined||o===null?"":o; }
function set(path,val){ var o=S,p=path.split("."); for(var i=0;i<p.length-1;i++){ if(!o[p[i]]) o[p[i]]={}; o=o[p[i]]; } o[p[p.length-1]]=val; DIRTY=true; }
var tt=null;
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on")},2600); }

/* ================= MOTOR DE CÁLCULO ================= */
function calc(){
  var c={}, p=S.predio, s=S.suelo;

  c.sumaOrigen = p.fusion ? p.origen.reduce(function(a,b){ return a+(n(b.sup)||0) },0) : null;
  c.supEscritura = p.fusion ? (c.sumaOrigen||null) : n(p.supEscritura);
  c.supLevantamiento = n(p.supLevantamiento);
  c.supPredio = c.supLevantamiento!==null ? c.supLevantamiento : c.supEscritura;
  c.difSup = (c.supEscritura!==null && c.supLevantamiento!==null) ? (c.supLevantamiento-c.supEscritura) : null;

  /* La clave de zonificación se compone de las partes que ya se capturan.
     Antes se escribía entera a mano y repetía los niveles y el área libre:
     dos sitios para el mismo dato, que es donde se cometen los errores.  */
  c.clave = s.claveManual ? (s.clave||"")
    : [s.usoClave, s.niveles, s.areaLibre, s.densidad]
        .filter(function(x){ return String(x||"")!==""; }).join("/");

  var al=n(s.areaLibre), niv=n(s.niveles);
  if(s.pot.activo && s.pot.modAreaLibre && n(s.pot.areaLibreNueva)!==null) al=n(s.pot.areaLibreNueva);
  c.areaLibrePct=al; c.nivelesPermitidos=niv;
  c.cos = (c.supPredio!==null && al!==null) ? c.supPredio*(1-al/100) : null;
  c.areaLibreReq = (c.supPredio!==null && al!==null) ? c.supPredio*(al/100) : null;
  c.factorCUS = (al!==null && niv!==null) ? (1-al/100)*niv : null;
  c.supMaxBase = (c.cos!==null && niv!==null) ? c.cos*niv : null;
  c.potM2 = s.pot.activo ? n(s.pot.m2) : null;
  c.supMaxTotal = c.supMaxBase!==null ? c.supMaxBase+(c.potM2||0) : null;

  var L=S.niveles.lista;
  c.supSNB = L.filter(function(x){return x.snb}).reduce(function(a,b){ return a+(n(b.hab)||0)+(n(b.noHab)||0) },0);
  c.supBNB = L.filter(function(x){return !x.snb}).reduce(function(a,b){ return a+(n(b.hab)||0)+(n(b.noHab)||0) },0);
  c.supTotal = c.supSNB+c.supBNB;
  var d=L.filter(function(x){return x.desplante});
  c.desplante = d.length ? d.reduce(function(a,b){ return a+(n(b.hab)||0)+(n(b.noHab)||0) },0) : null;
  c.nivelesProyectados = L.filter(function(x){return x.cuenta}).length;
  c.holguraCOS = (c.cos!==null && c.desplante!==null) ? c.cos-c.desplante : null;
  c.pctDesplante = (c.desplante!==null && c.supPredio) ? c.desplante/c.supPredio*100 : null;
  c.areaLibreReal = (c.supPredio!==null && c.desplante!==null) ? c.supPredio-c.desplante : null;
  c.pctAreaLibre = (c.areaLibreReal!==null && c.supPredio) ? c.areaLibreReal/c.supPredio*100 : null;
  c.holguraCUS = c.supMaxTotal!==null ? c.supMaxTotal-c.supSNB : null;
  c.nivelesTope = niv!==null ? niv+(s.pot.activo && s.pot.modNiveles ? (n(s.pot.nivelesExtra)||0) : 0) : null;

  /* potencial: cuánto se aprovecha realmente */
  if(s.pot.activo && c.potM2 && c.supMaxBase!==null){
    c.potUsado = Math.max(0, c.supSNB-c.supMaxBase);
    c.potSinUsar = Math.max(0, c.potM2-c.potUsado);
  } else { c.potUsado=null; c.potSinUsar=null; }

  var tv=n(S.viv.total);
  c.totalViviendas=tv;
  c.sumaPorNivel = S.viv.porNivel.reduce(function(a,b){ return a+(n(b.cant)||0) },0);
  var dm2 = s.pot.activo && s.pot.modDensidad ? n(s.pot.densidadNueva) : n(s.densidadM2);
  c.densidadM2=dm2;
  c.vivPermitidas = (dm2 && c.supPredio!==null) ? Math.floor(c.supPredio/dm2) : null;

  var e=S.elev;
  c.poblacion = tv!==null ? tv*((n(e.ocupRec)||0)*(n(S.viv.recamaras)||0)+(n(e.adicional)||0)) : null;
  c.movilizar = (c.poblacion!==null && n(e.pctDiseno)!==null) ? c.poblacion*n(e.pctDiseno)/100 : null;
  c.capElev = (n(e.rtt)&&n(e.capCabina)) ? (300/n(e.rtt))*n(e.capCabina) : null;
  c.elevMin = (c.movilizar!==null && c.capElev) ? Math.ceil(c.movilizar/c.capElev) : null;

  var pa=S.patios, sup=n(pa.nivelParamento), inf=n(pa.nptHab);
  c.alturaParamento = (sup!==null && inf!==null) ? sup-(inf+0.90) : null;
  c.ladoMin = c.alturaParamento!==null ? c.alturaParamento/3 : null;
  c.ladoReducido = c.ladoMin!==null ? c.ladoMin*0.8 : null;
  c.ortogonalReq = c.ladoMin!==null ? c.ladoMin*1.2 : null;
  c.patios = pa.lista.map(function(x){
    var a=n(x.corto), b=n(x.largo);
    /* el sentido transversal es SIEMPRE el menor de los dos, sin importar el orden capturado */
    var corto = (a!==null && b!==null) ? Math.min(a,b) : (a!==null?a:b);
    var largo = (a!==null && b!==null) ? Math.max(a,b) : null;
    var r={nombre:x.nombre||"Patio", cant:n(x.cant)||1, corto:corto, largo:largo,
           invertido:(a!==null&&b!==null&&a>b)};
    if(corto===null||largo===null||c.ladoMin===null){ r.estado="sin datos"; return r; }
    r.sup=corto*largo;
    if(corto >= c.ladoMin-0.0001){ r.estado="cumple"; r.deficit=0; }
    else if(corto >= c.ladoReducido-0.0001 && largo >= c.ortogonalReq-0.0001){ r.estado="cumple con reducción"; r.deficit=0; }
    else { r.estado="no cumple"; r.deficit=Math.max(c.ladoReducido-corto,0); r.faltaOrtogonal = largo < c.ortogonalReq; }
    return r;
  });

  var g=0, ch=0;
  S.estac.niveles.forEach(function(x){ g+=n(x.grandes)||0; ch+=n(x.chicos)||0; });
  c.cajGrandes=g; c.cajChicos=ch; c.cajTotal=g+ch;
  c.cajMax = (tv!==null && n(S.estac.maxPorViv)!==null) ? tv*n(S.estac.maxPorViv) : null;
  c.pctGrandes = c.cajTotal ? g/c.cajTotal*100 : null;
  c.pctChicos = c.cajTotal ? ch/c.cajTotal*100 : null;
  c.ratioCajones = c.cajMax ? c.cajTotal/c.cajMax : null;
  c.rampas = S.estac.rampas.map(function(r){
    var lo=n(r.long), pe=n(r.pend), de=n(r.desnivel), o={long:lo,pend:pe,desnivel:de};
    if(lo!==null&&pe!==null){ o.salva=lo*pe/100; o.dif = de!==null ? o.salva-de : null; }
    return o;
  });
  return c;
}

/* ================= SEMÁFORO (nunca entra al documento) ================= */
function revisar(c){
  var A=[];
  function add(l,t,v,d){ A.push({l:l,t:t,v:v,d:d}); }

  if(c.supPredio===null) add("a","Superficie del predio sin capturar","—","Sin ella no se calcula ningún coeficiente");
  if(c.difSup!==null && Math.abs(c.difSup)>0.005)
    add("a","Escritura y levantamiento no coinciden", fmt(c.difSup)+" m²",
      "Se está calculando con "+fmt(c.supPredio)+" m². Confirma cuál superficie reconoce la autoridad");

  if(c.holguraCUS!==null){
    if(c.holguraCUS < -0.005) add("r","CUS excedido", fmt(c.holguraCUS)+" m²","La superficie sobre banqueta supera el máximo permitido");
    else if(c.holguraCUS < 0.005) add("r","CUS agotado al 100%","0.00 m²","Cero tolerancia: cualquier criterio distinto del revisor tira el proyecto");
    else if(c.holguraCUS < 30) add("a","Holgura de CUS muy corta", fmt(c.holguraCUS)+" m²","Deja al menos 30 m² de margen");
    else add("v","Holgura de CUS", fmt(c.holguraCUS)+" m²","");
  }
  if(c.potSinUsar!==null && c.potM2){
    if(c.potSinUsar > 50 && c.potSinUsar > c.potM2*0.10)
      add("r","Potencial adquirido sin aprovechar", fmt(c.potSinUsar)+" m²",
        "Se adquirieron "+fmt(c.potM2)+" m² y el proyecto solo usa "+fmt(c.potUsado)+
        " m² por encima del máximo base. Revisa el dato o el proyecto");
    else add("v","Potencial adquirido aprovechado", fmt(c.potUsado)+" de "+fmt(c.potM2)+" m²","");
  }
  if(c.holguraCOS!==null){
    if(c.holguraCOS < -0.005) add("r","Desplante mayor que el COS", fmt(c.holguraCOS)+" m²","El área libre proyectada es menor que la exigida");
    else if(c.holguraCOS < 10) add("a","Holgura de COS corta", fmt(c.holguraCOS)+" m²","");
    else add("v","Holgura de COS", fmt(c.holguraCOS)+" m²","");
  }
  if(c.nivelesTope!==null && c.nivelesProyectados){
    if(c.nivelesProyectados > c.nivelesTope)
      add("r","Niveles por encima del tope", c.nivelesProyectados+" vs "+c.nivelesTope,
        S.suelo.pot.activo ? "El potencial adquirido suma superficie, no necesariamente niveles" : "Revisa contra el certificado");
    else add("v","Niveles dentro del tope", c.nivelesProyectados+" de "+c.nivelesTope,"");
  }
  if(c.vivPermitidas!==null && c.totalViviendas!==null){
    if(c.totalViviendas > c.vivPermitidas) add("r","Viviendas por encima de la densidad", c.totalViviendas+" vs "+c.vivPermitidas,"Resuelve qué densidad aplica antes de generar el documento");
    else add("v","Viviendas dentro de la densidad", c.totalViviendas+" de "+c.vivPermitidas,"");
  } else if(c.totalViviendas!==null){
    add("a","Densidad sin aterrizar","—","Captura los m² de terreno por vivienda que aplican a este predio");
  }
  if(c.totalViviendas!==null && c.sumaPorNivel && Math.abs(c.sumaPorNivel-c.totalViviendas)>0)
    add("r","Las viviendas por nivel no suman el total", c.sumaPorNivel+" vs "+c.totalViviendas,"");

  /* cuadre de NPT contra entrepiso */
  var L=S.niveles.lista;
  for(var i=0;i<L.length-1;i++){
    var a=n(L[i].npt), e=n(L[i].entrepiso), b=n(L[i+1].npt);
    if(a!==null&&e!==null&&b!==null&&Math.abs(a+e-b)>0.02)
      add("a","«"+(L[i].nombre||"Nivel")+"» + entrepiso no llega al siguiente NPT",
        fmt(a+e)+" vs "+fmt(b)+" m","");
  }

  if(c.alturaParamento===null) add("a","Altura de paramento de patios sin definir","—","Faltan el NPT habitable más bajo o el nivel superior del paramento");
  c.patios.forEach(function(p){
    if(p.estado==="no cumple")
      add("r","Patio «"+p.nombre+"» por debajo del mínimo", fmt(p.corto)+" m",
        "Faltan "+fmt(p.deficit)+" m para el mínimo reducido de "+fmt(c.ladoReducido)+" m"+
        (p.faltaOrtogonal?". Además la ortogonal no llega a "+fmt(c.ortogonalReq)+" m":""));
    else if(p.estado==="cumple con reducción")
      add("a","Patio «"+p.nombre+"» cumple solo con la reducción de 1/5", fmt(p.corto)+" × "+fmt(p.largo)+" m","Sin margen si cambia la altura de paramento");
    else if(p.estado==="cumple")
      add("v","Patio «"+p.nombre+"»", fmt(p.corto)+" × "+fmt(p.largo)+" m","");
  });
  if(S.patios.cubierta)
    add("a","Patios con cubierta","—","Verifica en la NTC vigente si un patio normativo admite cubrirse sin perder su función");

  if(c.pctGrandes!==null){
    if(c.pctGrandes < 40) add("r","Cajones grandes por debajo del 40%", fmt(c.pctGrandes,2)+"%",
      "Faltan "+Math.ceil(c.cajTotal*0.4-c.cajGrandes)+" cajones grandes");
    else if(c.pctGrandes < 42) add("a","Cajones grandes al límite", fmt(c.pctGrandes,2)+"%","");
    else add("v","Cajones grandes", fmt(c.pctGrandes,2)+"%","");
  }
  if(c.cajTotal && !n(S.estac.pcdCant))
    add("a","Sin cajones para personas con discapacidad","0 de "+c.cajTotal,"");
  if(c.ratioCajones!==null && c.ratioCajones>1)
    add("r","Cajones por encima del máximo permitido", c.cajTotal+" vs "+c.cajMax,"");
  c.rampas.forEach(function(r,i){
    if(r.dif!==null && Math.abs(r.dif)>0.02)
      add("a","Rampa "+(i+1)+": longitud y pendiente no dan el desnivel", fmt(r.salva)+" vs "+fmt(r.desnivel)+" m","");
  });
  if(c.elevMin!==null && n(S.elev.cantidad)!==null){
    if(n(S.elev.cantidad) < c.elevMin) add("r","Elevadores por debajo del mínimo", S.elev.cantidad+" vs "+c.elevMin,"");
    else add("v","Elevadores", S.elev.cantidad+" (mínimo "+c.elevMin+")","");
  }
  if(S.suelo.pot.activo && !S.suelo.pot.instrumento)
    add("a","Instrumento de potencial sin identificar","—","Pendiente por confirmar. El documento no lo nombrará");
  if(S.predio.fusion && !S.predio.docFusion.tipo)
    add("a","Documento que avala la fusión sin identificar","—","Pendiente por confirmar");
  return A;
}

/* Une la lista precargada con lo que el usuario haya escrito antes.       */
function opciones(fijas,cat){
  var L=(fijas||[]).slice();
  if(cat && CAT[cat]) CAT[cat].forEach(function(x){ if(L.indexOf(x)<0) L.push(x); });
  return L;
}

/* ---- combo: elegir de la lista o escribir uno nuevo ----
   Si el valor guardado no está en la lista (proyectos viejos, o algo que se
   escribió a mano), el campo arranca en modo escritura para no perderlo.  */
function FC(path,label,opt){

  h+='<option value="'+OTRO+'">Escribir otro…</option></select>'+
    '<input class="c-in" type="text"'+(libre?"":" hidden")+' value="'+esc(v)+

    '<button type="button" class="c-back" title="Volver a la lista"'+(libre?"":" hidden")+'>↩</button>'+
    '</div>';

/* ---- fichas: selección múltiple con tachecita ----
   El valor sigue guardándose como texto separado por comas, igual que
   cuando era un campo libre: la ficha y los proyectos viejos no cambian.  */
function partes(v){
  return String(v===null||v===undefined?"":v).split(/\s*[,;]\s*/)
    .map(function(x){ return x.trim(); }).filter(function(x){ return x!==""; });
}
function CHIPS(path,label,opt){

    '<div class="chips" data-chips="'+path+'"'+(opt.cat?' data-cat="'+esc(opt.cat)+'"':'')+'>';
  sel.forEach(function(x,i){
    h+='<span class="ch">'+esc(x)+'<button type="button" data-quita="'+i+'" '+
       'title="Quitar">✕</button></span>';
  });
  h+='<select class="ch-add"><option value="">'+(sel.length?"Añadir otro…":"Elegir…")+'</option>';
  L.forEach(function(o){ if(sel.indexOf(o)<0) h+='<option>'+esc(o)+'</option>'; });

}

/* ---- fecha con calendario ----
   Guarda AAAA-MM-DD. Si el campo traía texto de antes («Agosto 2026»), no
   se borra: se muestra debajo hasta que se elija una fecha que lo sustituya. */
function esISO(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v||"")); }
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];
function fFecha(v){
  if(!esISO(v)) return v||"";
  var p=String(v).split("-");
  return parseInt(p[2],10)+" de "+MESES[parseInt(p[1],10)-1]+" de "+p[0];
}
function FECHA(path,label,opt){
  opt=opt||{};
  var v=String(get(path)||""), iso=esISO(v);
  var h='<div class="f'+(opt.wide?" wide":"")+'"><label>'+esc(label)+'</label>'+
    '<input data-p="'+path+'" type="date" value="'+(iso?esc(v):"")+'">';
  if(!iso && v) h+='<div class="hint">Escrito antes: <b>'+esc(v)+
    '</b>. Elige una fecha para sustituirlo.</div>';
  else if(opt.hint) h+='<div class="hint">'+esc(opt.hint)+'</div>';
  return h+'</div>';
}

function enlazar(root){
  root.querySelectorAll("[data-p]").forEach(function(el){
    var ev = el.tagName==="SELECT"||el.type==="checkbox"||el.type==="date" ? "change" : "input";
    el.addEventListener(ev,function(){
      set(el.dataset.p, el.type==="checkbox" ? el.checked : el.value);
      pintarBarra(); pintarChip();
      if(el.type==="checkbox") render();
    });
  });

  /* ---- combos ---- */
  root.querySelectorAll("[data-combo]").forEach(function(box){
    var path=box.getAttribute("data-combo"), cat=box.getAttribute("data-cat");
    var sel=box.querySelector(".c-sel"), inp=box.querySelector(".c-in"),
        back=box.querySelector(".c-back");
    function modo(escribir){
      sel.hidden=escribir; inp.hidden=!escribir; back.hidden=!escribir;
    }
    sel.addEventListener("change",function(){
      if(sel.value===OTRO){ modo(true); inp.value=""; set(path,""); inp.focus(); }
      else { set(path,sel.value); pintarBarra(); pintarChip(); }
    });
    inp.addEventListener("input",function(){ set(path,inp.value); pintarBarra(); pintarChip(); });
    /* Al salir del campo, lo escrito se suma a la lista para la próxima vez. */
    inp.addEventListener("blur",function(){ if(cat) recordar(cat,inp.value); });
    back.addEventListener("click",function(){
      if(cat) recordar(cat,inp.value);
      set(path,""); render();
    });
  });

  /* ---- fichas ---- */
  root.querySelectorAll("[data-chips]").forEach(function(box){
    var path=box.getAttribute("data-chips"), cat=box.getAttribute("data-cat");
    var add=box.querySelector(".ch-add"), otro=box.querySelector(".ch-otro");
    function poner(val){
      val=String(val||"").trim(); if(!val) return;
      var L=partes(get(path));
      if(L.indexOf(val)<0) L.push(val);
      set(path,L.join(", "));
      if(cat) recordar(cat,val);
      render();
    }
    add.addEventListener("change",function(){
      if(add.value===OTRO){ add.hidden=true; otro.hidden=false; otro.focus(); }
      else if(add.value) poner(add.value);
    });
    otro.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); poner(otro.value); }
      else if(e.key==="Escape"){ otro.hidden=true; add.hidden=false; add.value=""; }
    });
    otro.addEventListener("blur",function(){ if(otro.value.trim()) poner(otro.value); });
    box.querySelectorAll("[data-quita]").forEach(function(b){
      b.addEventListener("click",function(){
        var L=partes(get(path));
        L.splice(parseInt(b.getAttribute("data-quita"),10),1);
        set(path,L.join(", ")); render();
      });
    });
  });
}
/* Un solo punto de entrada para pintar un campo: reparte al helper que toca
   según opt.tipo. Permite usar combos, fichas y fechas dentro de rep().    */
function CAMPO(path,label,opt){
  opt=opt||{};
  if(opt.tipo==="combo") return FC(path,label,opt);
  if(opt.tipo==="chips") return CHIPS(path,label,opt);
  if(opt.tipo==="fecha") return FECHA(path,label,opt);
  return F(path,label,opt);
}
function rep(arr, campos, path, etiqueta){
  var h='';
  arr.forEach(function(item,i){
    h+='<div class="rep"><div class="rep-h"><span>'+esc(etiqueta)+" "+(i+1)+'</span>'+
       '<button class="btn sm dgr" data-del="'+path+'" data-i="'+i+'">Quitar</button></div>'+
       '<div class="rep-b"><div class="grid">';
    campos.forEach(function(cp){ h+=CAMPO(path+"."+i+"."+cp[0], cp[1], cp[2]||{}); });
    h+='</div></div></div>';
  });
  if(!arr.length) h+='<div class="empty">Aún no hay '+esc(etiqueta.toLowerCase())+'. Añade el primero.</div>';
  h+='<div class="btnrow"><button class="btn" data-add="'+path+'">Añadir '+esc(etiqueta.toLowerCase())+'</button></div>';
  return h;
}
function acciones(root){
  root.querySelectorAll("[data-add]").forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.add.split("."), o=S;
      for(var i=0;i<p.length;i++) o=o[p[i]];
      o.push({}); DIRTY=true; render();
    };
  });
  root.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.del.split("."), o=S;
      for(var i=0;i<p.length;i++) o=o[p[i]];
      o.splice(parseInt(b.dataset.i,10),1); DIRTY=true; render();
    };
  });
  /* ---- imágenes de los gráficos ---- */
  root.querySelectorAll("[data-img]").forEach(function(inp){
    inp.onchange=async function(){
      var f = inp.files && inp.files[0];
      inp.value="";                       /* o elegir el mismo dos veces no dispara */
      if(!f) return;
      var gid = inp.dataset.img;
      toast("Procesando la imagen…");
      try{
        var r = await recomprimir(f);
        await guardarImagen(gid, {
          archivo:f.name, tipo:r.tipo, w:r.w, h:r.h, peso:r.peso,
          miniatura:r.miniatura, aviso:r.aviso, fecha:new Date().toISOString()
        }, r.bytes);
        /* Subir la imagen ES el estado: no hay que acordarse de marcarlo. */
        var g = S.graficos.filter(function(x){ return x.gid===gid; })[0];
        if(g && g.estado!=="No aplica"){ g.estado="Listo"; DIRTY=true; }
        render();
        toast(r.aviso ? r.aviso : "Imagen lista · "+pesoLegible(r.peso));
      }catch(e){
        toast(e && e.message ? e.message : "No se pudo procesar la imagen");
      }
    };
  });
  root.querySelectorAll("[data-quitaimg]").forEach(function(b){
    b.onclick=async function(){
      var gid=b.dataset.quitaimg;
      try{
        await borrarImagen(gid);
        var g = S.graficos.filter(function(x){ return x.gid===gid; })[0];
        if(g && g.estado==="Listo"){ g.estado="Pendiente"; DIRTY=true; }
        render(); toast("Imagen quitada");
      }catch(e){ toast("No se pudo quitar la imagen"); }
    };
  });

  /* ---- catálogo de respuestas frecuentes ---- */
  root.querySelectorAll("[data-olvida]").forEach(function(b){
    b.onclick=function(){
      olvidar(b.dataset.olvida, parseInt(b.dataset.i,10));
      VACIAR_CAT=null; render(); toast("Respuesta quitada de la lista");
    };
  });
  root.querySelectorAll("[data-vacia]").forEach(function(b){
    b.onclick=function(){ VACIAR_CAT=b.dataset.vacia; render(); };
  });
  root.querySelectorAll("[data-vacia-si]").forEach(function(b){
    b.onclick=function(){
      vaciarCategoria(b.dataset.vaciaSi);
      VACIAR_CAT=null; render(); toast("Lista vaciada");
    };
  });
  root.querySelectorAll("[data-vacia-no]").forEach(function(b){
    b.onclick=function(){ VACIAR_CAT=null; render(); };
  });
}

function ficha(){
  var c=calc(), A=revisar(c), L=[];
  function w(s){ L.push(s===undefined?"":s); }
  function kv(k,v,u){ if(v===null||v===undefined||v===""||v==="—") return; w("  "+k+": "+v+(u?" "+u:"")); }
  function num(k,v,u,d){ if(v===null||v===undefined||isNaN(v)) return; w("  "+k+": "+fmt(v,d===undefined?2:d)+(u?" "+u:"")); }

  w("=================================================================");
  w("FICHA DE PROYECTO PARA GENERAR MEMORIA DESCRIPTIVA");
  w("Generada por el artefacto de captura · "+new Date().toLocaleString("es-MX"));
  w("=================================================================");
  w("");
  w("INSTRUCCIONES");
  w("");
  w("Genera la memoria descriptiva del proyecto arquitectónico en un archivo");
  w("Word, con los datos de esta ficha, siguiendo las instrucciones y las");
  w("plantillas cargadas en este proyecto.");
  w("");
  w("REGLAS DE REDACCIÓN, sin excepción:");
  w("");
  w("1. El documento DESCRIBE. No dictamina, no certifica y no afirma");
  w("   cumplimiento normativo. Quien dictamina es el DRO.");
  w("2. No incluyas el tablero de revisión ni ninguna de las alertas de esta");
  w("   ficha. Son de uso interno.");
  w("3. Tampoco redactes lo contrario: nunca escribas frases que confiesen un");
  w("   incumplimiento ni que expliquen por cuántos centímetros falta algo.");
  w("   Ni confesión ni afirmación.");
  w("4. No inventes números de artículo, incisos ni dimensiones mínimas.");
  w("5. No afirmes que se verificó nada que esta ficha no contenga:");
  w("   estructura, instalaciones, rutas de evacuación, protección civil.");
  w("6. Un solo valor por dato en todo el documento.");
  w("7. Cierra con una conclusión descriptiva, no con un dictamen.");
  w("");
  w("Los gráficos te los subo por separado en el chat. Colócalos en la");
  w("sección que indica la lista del final de esta ficha.");
  w("");
  w("=================================================================");
  w("IDENTIFICACIÓN");

/* ================= EL DOCUMENTO =================
   Convierte el proyecto en la lista de bloques que entiende el motor.

   Lo que sale de aquí es lo MECÁNICO: la portada, las tablas de datos que
   produce calc() y los gráficos en su marco. La prosa de cada sección es la
   etapa 2 y se revisa frase por frase; por eso ahora solo llevan prosa las
   dos secciones de coeficientes, que ya se repasaron contra el Moras 330.

   Regla que no se rompe (§4.1): el documento describe. Ni una palabra sobre
   si algo cumple o deja de cumplir, y el tablero de revisión no entra.     */
function col(w,al){ return {w:w, al:al||"left"}; }
function m2(v){ return v===null||v===undefined||isNaN(v) ? "—" : fmt(v); }
function pct(v){ return v===null||v===undefined||isNaN(v) ? "—" : fmt(v)+" %"; }

function normaliza(s){
  return String(s||"").toLowerCase()
    .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i")
    .replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n");
}
/* Los NPT se escriben con signo, como en el documento de David: +1.80, -4.20. */
function npt(v){
  var x=n(v); if(x===null) return "—";
  return (x>=0?"+":"")+fmt(x);
}
/* Busca la palabra completa, no el trozo: «sótano» NO puede casar dentro de
   «semisótano», o la planta del semisótano acaba ilustrando el sótano.    */
function contienePalabra(texto, palabra){
  if(!palabra) return false;
  var i = texto.indexOf(palabra);
  while(i >= 0){
    var antes = i===0 ? "" : texto.charAt(i-1);
    var despues = texto.charAt(i+palabra.length);
    if(!/[a-z0-9]/.test(antes) && !/[a-z0-9]/.test(despues)) return true;
    i = texto.indexOf(palabra, i+1);
  }
  return false;
}
/* En prosa los números pequeños van con letra: «los cinco niveles». */
var NUMERO_LETRA=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho",
  "nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete",
  "dieciocho","diecinueve","veinte"];
function enLetra(x){
  var v=n(x);
  return (v!==null && v>=0 && v<=20 && v===Math.round(v)) ? NUMERO_LETRA[v] : String(x);
}
/* «Nivel» → «Niveles», «Planta» → «Plantas». */
function plural(p){
  if(/[aeiouáéíóú]$/i.test(p)) return p+"s";
  if(/z$/i.test(p)) return p.slice(0,-1)+"ces";
  return p+"es";
}
/* «A, B y C» — una lista en castellano, no separada por comas hasta el final. */
function enumerar(lista){
  var L=lista.filter(function(x){ return String(x||"").trim()!==""; });
  if(!L.length) return "";
  if(L.length===1) return L[0];
  return L.slice(0,-1).join(", ")+" y "+L[L.length-1];
}
/* El artículo depende del nombre del nivel: «el sótano», «la planta baja». */
var NIVEL_FEMENINO=/^(planta|azotea|terraza|cubierta|entreplanta)/i;
function elNivel(nombre, mayus){
  var art = NIVEL_FEMENINO.test(String(nombre||"").trim()) ? "la" : "el";
  if(mayus) art = art.charAt(0).toUpperCase()+art.slice(1);
  return art+" "+String(nombre||"nivel").toLowerCase();
}
/* Niveles consecutivos de planta idéntica se describen juntos, como hace
   David con los cinco niveles tipo: una sola sección en vez de cinco
   iguales. La comparación es sobre lo que define la planta.               */
/* «Nivel 1» … «Nivel 5» → «Niveles 1 a 5». Si los nombres no comparten
   raíz, se enumeran tal cual: «Sótano a Azotea» sería peor que la verdad. */
function tituloGrupo(nombres){
  if(nombres.length===1) return nombres[0];
  var m0=String(nombres[0]).match(/^(.*?)\s*(\d+)$/);
  var mn=String(nombres[nombres.length-1]).match(/^(.*?)\s*(\d+)$/);
  if(m0 && mn && m0[1] && m0[1]===mn[1])
    return plural(m0[1].trim())+" "+m0[2]+" a "+mn[2];
  return nombres[0]+" a "+nombres[nombres.length-1];
}
function agruparNiveles(L){
  var g=[], act=null;
  function firma(x){
    return [x.hab,x.noHab,x.entrepiso,x.libre,x.usos,x.texto,!!x.snb].join("|");
  }
  L.forEach(function(x){
    if(act && firma(act[0])===firma(x)) act.push(x);
    else { act=[x]; g.push(act); }
  });
  return g;
}

function bloquesDocumento(){
  var c=calc(), B=[], I=S.ident, U=S.suelo;
  function vacio(n){ for(var i=0;i<(n||1);i++) B.push({t:"vacio"}); }
  function titulo(n,txt){ B.push({t:"titulo", nivel:n, txt:txt}); }
  function parrafo(txt){ if(txt) B.push({t:"parrafo", txt:txt}); }
  function tabla(cols,enc,filas,op){
    if(!filas.length) return;
    B.push({t:"tabla", cols:cols, enc:enc, filas:filas, op:op});
  }
  /* Los gráficos se emparejan por palabra, no por número de apartado: la
     numeración del documento se calcula sola y cambia al añadir un nivel,
     así que atarlos a un «2.5» los dejaría colgados a la primera.        */
  var puestos = {};
  function graficos(palabras, porNombre){
    S.graficos.forEach(function(g){
      if(g.estado==="No aplica" || puestos[g.gid]) return;
      var donde = normaliza((porNombre?g.nombre:g.seccion)||"");
      var toca = palabras.some(function(p){ return contienePalabra(donde, normaliza(p)); });
      if(!toca) return;
      puestos[g.gid]=true;
      B.push({t:"grafico", nombre:g.nombre||"Gráfico", pie:g.pie||null,
              gid:g.gid, imagen:null});
    });
  }
  /* Numeración del capítulo 2: secuencial, en el orden en que se emiten. */
  var cap2 = 0;
  function seccion2(txt){ cap2++; titulo(2, "2."+cap2+" "+txt); }

  /* ---------------------------------------------------------- portada -- */
  vacio(9);
  var dom = [I.calle, I.colonia?"Colonia "+I.colonia:""].filter(Boolean).join(", ");
  var ciudad = ["Alcaldía "+(I.alcaldia||""), I.cp?"C.P. "+I.cp:"", "Ciudad de México"]
    .filter(function(x){ return x && x!=="Alcaldía "; }).join(", ");
  var lineas = [
    {txt:"MEMORIA DESCRIPTIVA", tam:48, negrita:true, color:"1F3864", despues:60},
    {txt:"DEL PROYECTO ARQUITECTÓNICO", tam:36, negrita:true, color:"1F3864", despues:360}
  ];
  if(I.denominacion) lineas.push({txt:I.denominacion, tam:28, negrita:true, despues:60});
  if(dom) lineas.push({txt:dom, tam:24, despues:60});
  if(ciudad) lineas.push({txt:ciudad, tam:24, despues:360});
  B.push({t:"portada", lineas:lineas});

  var reticula=[];
  if(I.propietario) reticula.push(["Propietario", I.propietario]);
  if(I.proyectista) reticula.push(["Proyectista", I.proyectista]);
  if(I.despacho) reticula.push(["Despacho", I.despacho]);
  if(I.dro) reticula.push(["Director Responsable de Obra", I.dro]);
  if(I.fecha) reticula.push(["Fecha", fFecha(I.fecha)]);
  tabla([col(2800,"center"), col(4400,"center")], null, reticula,
        {ancho:7200, bordes:false, tam:null, primeraNegrita:true});
  B.push({t:"salto"});

  /* ------------------------------------------------------------ 1.4 COS -- */
  titulo(2,"1.4 Coeficiente de Ocupación del Suelo (COS)");
  if(c.supPredio!==null && c.areaLibrePct!==null)
    parrafo("Con una superficie de terreno de "+m2(c.supPredio)+" m² y un porcentaje "+
      "mínimo de área libre del "+fmt(c.areaLibrePct,0)+" %, la superficie máxima de "+
      "desplante y el área libre mínima resultan como sigue:");
  tabla([col(4560), col(2400,"right"), col(2400,"right")],
    ["Concepto","Superficie (m²)","Porcentaje"],
    [["Superficie del predio", m2(c.supPredio), "100 %"],
     ["Superficie máxima de desplante", m2(c.cos),
      c.areaLibrePct===null?"—":fmt(100-c.areaLibrePct,0)+" %"],
     ["Área libre mínima", m2(c.areaLibreReq),
      c.areaLibrePct===null?"—":fmt(c.areaLibrePct,0)+" %"]]);
  if(c.desplante && c.pctDesplante!==null)
    parrafo("El proyecto se desplanta en "+m2(c.desplante)+" m², equivalentes al "+
      pct(c.pctDesplante)+" de la superficie del predio, con lo que el área libre "+
      "resultante es de "+m2(c.areaLibreReal)+" m², equivalentes al "+
      pct(c.pctAreaLibre)+".");
  graficos(["COS","ocupación del suelo"]);

  /* ------------------------------------------------------------ 1.5 CUS -- */
  titulo(2,"1.5 Coeficiente de Utilización del Suelo (CUS)");
  /* El instrumento del potencial no se nombra mientras no esté confirmado:
     se referencia por su apartado, como manda la regla 6.                  */
  parrafo("El factor de utilización del suelo resulta de multiplicar el coeficiente "+
    "de ocupación por el número de niveles que corresponde a la zonificación. "+
    "Aplicado a la superficie del predio"+
    (c.potM2 ? ", y sumada la superficie adquirida conforme al instrumento señalado "+
      "en el apartado de uso de suelo," : ",")+
    " la superficie máxima de construcción es la siguiente:");
  var fCus=[["Superficie máxima de construcción por zonificación", m2(c.supMaxBase)]];
  if(c.potM2) fCus.push(["Superficie de construcción adicional adquirida", m2(c.potM2)]);
  fCus.push(["Superficie máxima total de construcción", m2(c.supMaxTotal)]);
  tabla([col(6960), col(2400,"right")], ["Concepto","Superficie (m²)"], fCus);

  var L=S.niveles.lista;
  if(L.length){
    parrafo("La superficie de construcción del proyecto se distribuye por nivel de la "+
      "siguiente manera:");
    var filas=[], snb=[], bnb=[];
    L.forEach(function(x){ (x.snb?snb:bnb).push(x); });
    function renglon(x){
      var hab=n(x.hab), no=n(x.noHab);
      return [x.nombre||"—", x.npt?String(x.npt):"—",
              hab===null?"—":fmt(hab), no===null?"—":fmt(no),
              fmt((hab||0)+(no||0)), x.snb?"S.N.B.":"B.N.B."];
    }
    function suma(lista,campo){
      return lista.reduce(function(a,x){ return a+(n(x[campo])||0); },0);
    }
    snb.slice().reverse().forEach(function(x){ filas.push(renglon(x)); });
    if(snb.length) filas.push(["Subtotal sobre nivel de banqueta","",
      fmt(suma(snb,"hab")), fmt(suma(snb,"noHab")), fmt(c.supSNB), ""]);
    bnb.slice().reverse().forEach(function(x){ filas.push(renglon(x)); });
    if(bnb.length) filas.push(["Subtotal bajo nivel de banqueta","",
      fmt(suma(bnb,"hab")), fmt(suma(bnb,"noHab")), fmt(c.supBNB), ""]);
    filas.push(["Superficie total de construcción","",
      fmt(suma(L,"hab")), fmt(suma(L,"noHab")), fmt(c.supTotal), ""]);
    tabla([col(2160), col(1200,"right"), col(1500,"right"), col(1500,"right"),
           col(1500,"right"), col(1500,"center")],
      ["Nivel","N.P.T. (m)","Habitable (m²)","No habitable (m²)","Total (m²)","Ubicación"],
      filas);
    parrafo("La superficie de construcción sobre el nivel de banqueta asciende a "+
      m2(c.supSNB)+" m². La superficie desarrollada bajo el nivel de banqueta es de "+
      m2(c.supBNB)+" m². La superficie total de construcción del proyecto es de "+
      m2(c.supTotal)+" m².");
  }
  graficos(["CUS","utilización del suelo","superficies por nivel","niveles y superficies"]);

  /* ------------------------------------------- 2.x recorrido por niveles --
     Un apartado por nivel, de abajo hacia arriba. Los niveles consecutivos
     de planta idéntica van juntos, como los cinco niveles tipo del Moras.
     El primer párrafo es pura cifra y sale de la captura; el segundo dice
     qué aloja, y ahí manda el texto propio del nivel si lo hay.          */
  if(L.length){
    B.push({t:"titulo", nivel:1, txt:"2. Descripción del proyecto arquitectónico"});
    agruparNiveles(L).forEach(function(grupo){
      var x = grupo[0], varios = grupo.length>1;
      var hab=n(x.hab), no=n(x.noHab), total=(hab||0)+(no||0);
      var nombres = grupo.map(function(y){ return y.nombre||"Nivel"; });
      seccion2(tituloGrupo(nombres));

      /* --- párrafo 1: la ficha física --- */
      var alturas=[];
      if(n(x.entrepiso)!==null) alturas.push("altura de entrepiso de "+fmt(n(x.entrepiso))+" metros");
      if(n(x.libre)!==null) alturas.push("altura libre de "+fmt(n(x.libre))+" metros");
      var superficie = (hab && no)
        ? "una superficie total de "+m2(total)+" m², de los cuales "+m2(hab)+
          " m² corresponden a superficie habitable y "+m2(no)+" m² a superficie no habitable"
        : (hab ? "una superficie de "+m2(hab)+" m², en su totalidad habitable"
               : "una superficie de "+m2(total)+" m², en su totalidad no habitable");

      if(varios){
        parrafo("Los "+enLetra(grupo.length)+" niveles son de planta idéntica. "+
                "Cada uno ocupa "+superficie+
                (alturas.length?", con "+enumerar(alturas):"")+".");
      } else {
        var ini = n(x.npt)!==null
          ? "Con nivel de piso terminado en "+npt(x.npt)+" metros"+
            (alturas.length?", "+enumerar(alturas):"")+", "
          : "";
        parrafo(ini + (ini?elNivel(x.nombre):elNivel(x.nombre,true)) +
                " ocupa "+superficie+".");
      }

      /* --- párrafo 2: qué aloja --- */
      if(x.texto && String(x.texto).trim()) parrafo(String(x.texto).trim());
      else {
        var usos = partes(x.usos);
        if(usos.length)
          parrafo((varios?"Cada nivel aloja ":"En este nivel se alojan ")+
                  enumerar(usos)+".");
      }

      /* Los desplantes de un grupo se listan al final, como en el original. */
      if(varios){
        var npts = grupo.map(function(y){ return n(y.npt)!==null ? npt(y.npt) : null; })
                        .filter(Boolean);
        if(npts.length===grupo.length)
          parrafo("Los niveles se desplantan en "+enumerar(npts)+" metros respectivamente.");
      }

      /* La planta de cada nivel, emparejada por su nombre. */
      graficos(nombres, true);
    });
  }

  /* --------------------------------------------------------- 2.x tablas -- */
  if(L.length){
    seccion2("Alturas");
    tabla([col(2760), col(1600,"right"), col(1600,"right"), col(1600,"right"),
           col(1800,"center")],
      ["Nivel","N.P.T. (m)","Entrepiso (m)","Altura libre (m)","Ubicación"],
      L.slice().reverse().map(function(x){
        return [x.nombre||"—", n(x.npt)!==null?npt(x.npt):"—",
                x.entrepiso?String(x.entrepiso):"—",
                x.libre?String(x.libre):"—", x.snb?"S.N.B.":"B.N.B."];
      }));
    if(n(S.niveles.pretil)!==null)
      parrafo("El pretil o remate del edificio se ubica en el nivel "+
              npt(S.niveles.pretil)+" metros.");
    graficos(["altura","corte"]);
  }

  if(c.patios.length){
    seccion2("Patios de iluminación y ventilación");
    tabla([col(3360), col(1400,"center"), col(1800,"right"), col(1800,"right"),
           col(1800,"right")],
      ["Patio","Cantidad","Sentido transversal (m)","Sentido longitudinal (m)","Superficie (m²)"],
      c.patios.map(function(p){
        return [p.nombre||"—", String(p.cant||1), fmt(p.corto), fmt(p.largo),
                p.sup?fmt(p.sup):"—"];
      }));
    graficos(["patio"]);
  }

  if(S.estac.niveles.length){
    seccion2("Estacionamiento");
    tabla([col(2760), col(1650,"right"), col(1650,"right"), col(1650,"right"), col(1650,"right")],
      ["Nivel","Cajones grandes","Cajones chicos","Total","Dimensión del grande"],
      S.estac.niveles.map(function(x){
        var g=n(x.grandes)||0, ch=n(x.chicos)||0;
        return [x.nivel||"—", String(g), String(ch), String(g+ch), x.dimG||"—"];
      }));
  }

  if(S.elev.cantidad || S.elev.escaleras){
    seccion2("Circulación vertical");
    var fe=[];
    if(S.elev.nucleos) fe.push(["Núcleos de circulación vertical", String(S.elev.nucleos)]);
    if(S.elev.cantidad) fe.push(["Elevadores", String(S.elev.cantidad)]);
    if(S.elev.escaleras) fe.push(["Escaleras", String(S.elev.escaleras)]);
    if(S.elev.nivelesServidos) fe.push(["Niveles servidos", String(S.elev.nivelesServidos)]);
    if(c.poblacion!==null) fe.push(["Población de cálculo", fmt(c.poblacion,0)+" habitantes"]);
    tabla([col(4560), col(4800,"right")], ["Concepto","Dato"], fe);
  }

  /* Los gráficos de secciones que este documento todavía no arma se ponen al
     final, para que ninguno se quede fuera sin que se note.                */
  var sueltos = S.graficos.filter(function(g){
    return g.estado!=="No aplica" && !puestos[g.gid];
  });
  if(sueltos.length){
    titulo(2,"Gráficos complementarios");
    sueltos.forEach(function(g){
      B.push({t:"grafico", nombre:g.nombre||"Gráfico", pie:g.pie||null,
              gid:g.gid, imagen:null});
    });
  }
  return B;
}

/* Trae de IndexedDB los bytes de cada gráfico que tenga imagen y los pega a
   su bloque. Un fallo al leer una imagen no tumba el documento: ese gráfico
   sale como marcador, que es justo lo que significa.                       */
async function conImagenes(B){
  for(var i=0;i<B.length;i++){
    var b=B[i];
    if(b.t!=="grafico" || !b.gid || !IMGS[b.gid]) continue;
    try{
      var bytes = await leerImagenBytes(S.id, b.gid);
      if(bytes) b.imagen = {bytes: bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)};
    }catch(e){ /* se queda como marcador */ }
  }
  return B;
}

function nombreArchivo(){
  var base = (S.ident.denominacion || S.nombre || "Memoria descriptiva");
  var dom = S.ident.calle ? " — "+S.ident.calle : "";
  return ("Memoria descriptiva — "+base+dom)
    .replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g," ").trim().slice(0,120)+".docx";
}
function descargarBinario(nombre, bytes){
  try{
    var blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
    return true;
  }catch(e){ return false; }
}
async function generarDocumento(){
  if(!S) return;
  try{
    var B = await conImagenes(bloquesDocumento());
    var bytes = DOCX.generar(B, {
      titulo: S.ident.denominacion || S.nombre,
      autor: S.ident.proyectista || S.ident.despacho || "",
      version: VERSION
    });
    if(!descargarBinario(nombreArchivo(), bytes))
      return toast("El navegador no dejó descargar el archivo");
    toast("Documento generado · "+pesoLegible(bytes.length));
  }catch(e){
    toast(e && e.message ? "No se generó: "+e.message : "No se pudo generar el documento");
  }
}
