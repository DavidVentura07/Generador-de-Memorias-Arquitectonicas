      v.setUint16(4, 20, true);           // version necesaria
      v.setUint16(6, 0x0800, true);       // nombres en UTF-8
      v.setUint16(8, 0, true);            // metodo: almacenado
      v.setUint16(10, hora, true);
      v.setUint16(12, fecha, true);
      v.setUint32(14, suma, true);
      v.setUint32(18, datos.length, true);
      v.setUint32(22, datos.length, true);
      v.setUint16(26, nombre.length, true);
      v.setUint16(28, 0, true);
      lh.set(nombre, 30);

      var cd = new Uint8Array(46 + nombre.length);
      var w = new DataView(cd.buffer);
      w.setUint32(0, 0x02014B50, true);   // firma de directorio central
      w.setUint16(4, 20, true);
      w.setUint16(6, 20, true);
      w.setUint16(8, 0x0800, true);
      w.setUint16(10, 0, true);
      w.setUint16(12, hora, true);
      w.setUint16(14, fecha, true);
      w.setUint32(16, suma, true);
      w.setUint32(20, datos.length, true);
      w.setUint32(24, datos.length, true);
      w.setUint16(28, nombre.length, true);
      w.setUint32(42, desplazamiento, true);
      cd.set(nombre, 46);

      locales.push(lh, datos);
      central.push(cd);
      desplazamiento += lh.length + datos.length;
    });

    var largoCentral = central.reduce(function (a, b) { return a + b.length; }, 0);
    var fin = new Uint8Array(22);
    var f = new DataView(fin.buffer);
    f.setUint32(0, 0x06054B50, true);
    f.setUint16(8, entradas.length, true);
    f.setUint16(10, entradas.length, true);
    f.setUint32(12, largoCentral, true);
    f.setUint32(16, desplazamiento, true);

    var partes = locales.concat(central, [fin]);
    var total = partes.reduce(function (a, b) { return a + b.length; }, 0);
    var salida = new Uint8Array(total), p = 0;
    partes.forEach(function (x) { salida.set(x, p); p += x.length; });
    return salida;
  }

  /* -------------------------------------------------------------- imagenes -- */

  // Dimensiones en pixeles leyendo la cabecera del archivo. Solo hace falta para
  // conservar la proporcion al escalar; en el navegador tambien lo daria un <img>,
  // pero asi el motor no depende del DOM.
  function medir(bytes) {
    // PNG: la cabecera IHDR empieza en el byte 16.
    if (bytes[0] === 0x89 && bytes[1] === 0x50) {
      var v = new DataView(bytes.buffer, bytes.byteOffset);
      return { ancho: v.getUint32(16), alto: v.getUint32(20), tipo: 'png' };
    }
    // JPEG: recorrer los marcadores hasta el de inicio de cuadro (SOFn).
    if (bytes[0] === 0xFF && bytes[1] === 0xD8) {
      var i = 2;
      while (i < bytes.length) {
        if (bytes[i] !== 0xFF) { i++; continue; }
        var m = bytes[i + 1];
        if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
          return {
            alto: (bytes[i + 5] << 8) | bytes[i + 6],
            ancho: (bytes[i + 7] << 8) | bytes[i + 8],
            tipo: 'jpeg'
          };
        }
        i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
      }
    }
    return null;
  }

  var EMU_POR_PULGADA = 914400;
  var ANCHO_MAX = Math.round(6.33 * EMU_POR_PULGADA);   // ancho util dentro del marco
  var ALTO_MAX = Math.round(6.50 * EMU_POR_PULGADA);    // para que quepa con membrete

  function escalar(dim) {
    // Se asume 96 puntos por pulgada, que es lo que exporta cualquier CAD a imagen.
    var cx = Math.round(dim.ancho / 96 * EMU_POR_PULGADA);
    var cy = Math.round(dim.alto / 96 * EMU_POR_PULGADA);
    var f = Math.min(ANCHO_MAX / cx, ALTO_MAX / cy, 1);
    return { cx: Math.round(cx * f), cy: Math.round(cy * f) };
  }

  /* ------------------------------------------------------------------ xml -- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Un texto con espacios al inicio o al final necesita xml:space, o Word los come.
  function corrida(txt, rpr) {
    return '<w:r>' + (rpr || '') + '<w:t xml:space="preserve">' + esc(txt) + '</w:t></w:r>';
  }

  var AZUL = '1F3864';   // el azul de los titulos de David

  function parrafo(txt, op) {
    op = op || {};
    var ppr = '<w:pPr><w:spacing w:after="' + (op.despues == null ? 120 : op.despues) + '"/>' +
      '<w:jc w:val="' + (op.al || 'both') + '"/></w:pPr>';
    return '<w:p>' + ppr + corrida(txt) + '</w:p>';
  }

  function titulo(nivel, txt) {
    var cfg = {
      1: { estilo: 'Ttulo1', sz: 28, antes: 360, despues: 180 },
      2: { estilo: 'Ttulo2', sz: 24, antes: 280, despues: 140 },
      3: { estilo: 'Ttulo3', sz: 22, antes: 240, despues: 120 }
    }[nivel];
    return '<w:p><w:pPr><w:pStyle w:val="' + cfg.estilo + '"/>' +
      '<w:spacing w:before="' + cfg.antes + '" w:after="' + cfg.despues + '"/></w:pPr>' +
      corrida(txt, '<w:rPr><w:b/><w:bCs/><w:color w:val="' + AZUL + '"/>' +
        '<w:sz w:val="' + cfg.sz + '"/><w:szCs w:val="' + cfg.sz + '"/></w:rPr>') +
      '</w:p>';
  }

  function vacio() { return '<w:p/>'; }

  function saltoDePagina() {
    return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  }

  var ANCHO_TABLA = 9360;   // ancho util de la hoja carta con margenes de 2.54 cm

  // cols:  [ {w:4560, al:'left'|'right'|'center'} ]
  // enc:   [ "Concepto", ... ]     (opcional; si falta, la tabla no lleva fila de titulos)
  // filas: [ [ "...", "..." ] ]
  // op:    { ancho, bordes:false, tam:null, primeraNegrita:true }
  //        Las tablas de datos van con borde gris y encabezado sombreado. La de la
  //        caratula va sin lineas visibles, mas angosta y con la primera columna en
  //        negrita: es una retícula de rotulos, no una tabla de datos.
  function tabla(cols, enc, filas, op) {
    op = op || {};
    var conBordes = op.bordes !== false;
    var tam = op.tam === undefined ? 20 : op.tam;   // null = tamaño normal del documento

    function celda(col, txt, negrita, sombra) {
      var rpr = '<w:rPr>' + (negrita ? '<w:b/><w:bCs/>' : '') +
        (tam ? '<w:sz w:val="' + tam + '"/><w:szCs w:val="' + tam + '"/>' : '') + '</w:rPr>';
      return '<w:tc><w:tcPr><w:tcW w:w="' + col.w + '" w:type="dxa"/>' +
        (sombra ? '<w:shd w:val="clear" w:color="auto" w:fill="D9D9D9"/>' : '') +
        '<w:tcMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>' +
        '<w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tcMar>' +
        '<w:vAlign w:val="center"/></w:tcPr>' +
        '<w:p><w:pPr><w:spacing w:line="240" w:lineRule="auto"/>' +
        (col.al && col.al !== 'left' ? '<w:jc w:val="' + col.al + '"/>' : '') + '</w:pPr>' +
        corrida(txt, rpr) + '</w:p></w:tc>';
    }

    function fila(valores, encabezado) {
      return '<w:tr><w:trPr>' + (encabezado ? '<w:tblHeader/>' : '') +
        '<w:jc w:val="center"/></w:trPr>' +
        cols.map(function (c, i) {
          var negrita = encabezado || (op.primeraNegrita && i === 0);
          return celda(c, valores[i], negrita, encabezado && conBordes);
        }).join('') + '</w:tr>';
    }

    var b = conBordes
      ? '<w:top w:val="single" w:sz="4" w:space="0" w:color="7F7F7F"/>' +
        '<w:left w:val="single" w:sz="4" w:space="0" w:color="7F7F7F"/>' +
        '<w:bottom w:val="single" w:sz="4" w:space="0" w:color="7F7F7F"/>' +
        '<w:right w:val="single" w:sz="4" w:space="0" w:color="7F7F7F"/>' +
        '<w:insideH w:val="single" w:sz="2" w:space="0" w:color="BFBFBF"/>' +
        '<w:insideV w:val="single" w:sz="2" w:space="0" w:color="BFBFBF"/>'
      : '<w:top w:val="none" w:sz="0" w:space="0" w:color="FFFFFF"/>' +
        '<w:left w:val="none" w:sz="0" w:space="0" w:color="FFFFFF"/>' +
        '<w:bottom w:val="none" w:sz="0" w:space="0" w:color="FFFFFF"/>' +
        '<w:right w:val="none" w:sz="0" w:space="0" w:color="FFFFFF"/>' +
        '<w:insideH w:val="none" w:sz="0" w:space="0" w:color="FFFFFF"/>' +
        '<w:insideV w:val="none" w:sz="0" w:space="0" w:color="FFFFFF"/>';

    var x = '<w:tbl><w:tblPr><w:tblW w:w="' + (op.ancho || ANCHO_TABLA) + '" w:type="dxa"/>' +
      '<w:jc w:val="center"/><w:tblBorders>' + b + '</w:tblBorders>' +
      '<w:tblCellMar><w:left w:w="10" w:type="dxa"/><w:right w:w="10" w:type="dxa"/></w:tblCellMar>' +
      '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" ' +
      'w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr><w:tblGrid>' +
      cols.map(function (c) { return '<w:gridCol w:w="' + c.w + '"/>'; }).join('') +
      '</w:tblGrid>';

    if (enc) x += fila(enc, true);
    filas.forEach(function (f) { x += fila(f, false); });
    return x + '</w:tbl>';
  }

  // El marco punteado que David ya usa para los graficos: tabla de una celda con
  // la imagen centrada, o con el marcador de texto si el grafico aun no se sube.
  function marco(interior) {
    return '<w:tbl><w:tblPr><w:tblW w:w="' + ANCHO_TABLA + '" w:type="dxa"/><w:tblBorders>' +
      '<w:top w:val="dashed" w:sz="6" w:space="0" w:color="808080"/>' +
      '<w:left w:val="dashed" w:sz="6" w:space="0" w:color="808080"/>' +
      '<w:bottom w:val="dashed" w:sz="6" w:space="0" w:color="808080"/>' +
      '<w:right w:val="dashed" w:sz="6" w:space="0" w:color="808080"/>' +
      '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/>' +
      '<w:insideV w:val="single" w:sz="4" w:space="0" w:color="auto"/></w:tblBorders>' +
      '<w:tblCellMar><w:left w:w="10" w:type="dxa"/><w:right w:w="10" w:type="dxa"/></w:tblCellMar>' +
      '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" ' +
      'w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr>' +
      '<w:tblGrid><w:gridCol w:w="' + ANCHO_TABLA + '"/></w:tblGrid><w:tr><w:tc>' +
      '<w:tcPr><w:tcW w:w="' + ANCHO_TABLA + '" w:type="dxa"/>' +
      '<w:tcMar><w:top w:w="200" w:type="dxa"/><w:left w:w="120" w:type="dxa"/>' +
      '<w:bottom w:w="200" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>' +
      '</w:tcPr>' + interior + '</w:tc></w:tr></w:tbl>';
  }

  function marcador(txt) {
    return marco('<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' +
      corrida('[ GRÁFICO — ' + txt + ' ]',
        '<w:rPr><w:i/><w:iCs/><w:color w:val="808080"/>' +
        '<w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>') + '</w:p>');
  }

  function dibujo(rid, cx, cy, id, nombre) {
    return '<w:r><w:rPr><w:noProof/></w:rPr><w:drawing>' +
      '<wp:inline distT="0" distB="0" distL="0" distR="0" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">' +
      '<wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
      '<wp:effectExtent l="0" t="0" r="0" b="0"/>' +
      '<wp:docPr id="' + id + '" name="' + esc(nombre) + '"/>' +
      '<wp:cNvGraphicFramePr><a:graphicFrameLocks ' +
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/>' +
      '</wp:cNvGraphicFramePr>' +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">' +
      '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:nvPicPr><pic:cNvPr id="0" name="' + esc(nombre) + '"/>' +
      '<pic:cNvPicPr><a:picLocks noChangeAspect="1" noChangeArrowheads="1"/></pic:cNvPicPr>' +
      '</pic:nvPicPr><pic:blipFill>' +
      '<a:blip r:embed="' + rid + '" cstate="print" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>' +
      '<a:srcRect/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr bwMode="auto"><a:xfrm><a:off x="0" y="0"/>' +
      '<a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/>' +
      '<a:ln><a:noFill/></a:ln></pic:spPr></pic:pic></a:graphicData></a:graphic>' +
      '</wp:inline></w:drawing></w:r>';
  }

  function pieDeGrafico(txt) {
    return '<w:p><w:pPr><w:spacing w:before="60" w:after="0"/><w:jc w:val="center"/></w:pPr>' +
      corrida(txt, '<w:rPr><w:i/><w:iCs/><w:color w:val="595959"/>' +
        '<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr>') + '</w:p>';
  }

  /* -------------------------------------------------------------- portada -- */

  function lineaPortada(txt, tam, negrita, color, despues) {
    return '<w:p><w:pPr><w:spacing w:after="' + despues + '"/><w:jc w:val="center"/></w:pPr>' +
      corrida(txt, '<w:rPr>' + (negrita ? '<w:b/><w:bCs/>' : '') +
        (color ? '<w:color w:val="' + color + '"/>' : '') +
        '<w:sz w:val="' + tam + '"/><w:szCs w:val="' + tam + '"/></w:rPr>') + '</w:p>';
  }

  /* -------------------------------------------------------------- armado -- */

  var SECT_PR =
    '<w:sectPr>' +
    '<w:headerReference w:type="default" r:id="rId9" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>' +
    '<w:footerReference w:type="default" r:id="rId10" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>' +
    '<w:pgSz w:w="12240" w:h="15840"/>' +
    '<w:pgMar w:top="1985" w:right="1440" w:bottom="1440" w:left="1440" ' +
    'w:header="708" w:footer="708" w:gutter="0"/>' +
    '<w:cols w:space="720"/><w:docGrid w:linePitch="360"/></w:sectPr>';

  var NS_DOCUMENTO =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<w:document ' +
    'xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas" ' +
    'xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" ' +
    'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
    'xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math" ' +
    'xmlns:v="urn:schemas-microsoft-com:vml" ' +
    'xmlns:wp14="http://schemas.microsoft.com/office/word/2010/wordprocessingDrawing" ' +
    'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
    'xmlns:w10="urn:schemas-microsoft-com:office:word" ' +
    'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
    'xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" ' +
    'xmlns:w15="http://schemas.microsoft.com/office/word/2012/wordml" ' +
    'xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup" ' +
    'xmlns:wpi="http://schemas.microsoft.com/office/word/2010/wordprocessingInk" ' +
    'xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml" ' +
    'xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape" ' +
    'mc:Ignorable="w14 w15 wp14">';

  // Relaciones fijas: las partes que siempre estan. Las imagenes se numeran desde 100.
  var RELS_FIJAS = [
    ['rId1', 'numbering', 'numbering.xml'],
    ['rId2', 'styles', 'styles.xml'],
    ['rId3', 'settings', 'settings.xml'],
    ['rId4', 'webSettings', 'webSettings.xml'],
    ['rId5', 'footnotes', 'footnotes.xml'],
    ['rId6', 'endnotes', 'endnotes.xml'],
    ['rId7', 'fontTable', 'fontTable.xml'],
    ['rId8', 'theme', 'theme/theme1.xml'],
    ['rId9', 'header', 'header1.xml'],
    ['rId10', 'footer', 'footer1.xml']

  /* bloques: arreglo producido por las plantillas. Cada bloque es
   *   {t:'titulo', nivel, txt}
   *   {t:'parrafo', txt, al}
   *   {t:'tabla', cols, enc, filas}
   *   {t:'grafico', nombre, pie, imagen:{bytes, tipo}|null}
   *   {t:'portada', lineas:[{txt,tam,negrita,color,despues}]}
   *   {t:'vacio'}
   */
  function generar(bloques, meta) {
    meta = meta || {};
    var cuerpo = '', medios = [], siguienteRid = 100, siguienteId = 1;

    bloques.forEach(function (b) {
      switch (b.t) {
        case 'titulo':
          cuerpo += titulo(b.nivel, b.txt); break;
        case 'parrafo':
          cuerpo += parrafo(b.txt, { al: b.al }); break;
        case 'vacio':
          cuerpo += vacio(); break;
        case 'salto':
          cuerpo += saltoDePagina(); break;
        case 'portada':
          b.lineas.forEach(function (l) {
            cuerpo += l.txt === ''
              ? vacio()
              : lineaPortada(l.txt, l.tam, l.negrita, l.color, l.despues == null ? 60 : l.despues);
          });
          break;
        case 'tabla':
          cuerpo += tabla(b.cols, b.enc, b.filas, b.op) + vacio(); break;
        case 'grafico':
          if (b.imagen && b.imagen.bytes) {
            var dim = medir(b.imagen.bytes);
            if (!dim) throw new Error('No se reconoce la imagen del gráfico «' + b.nombre + '».');
            var tam = escalar(dim);
            var rid = 'rId' + (siguienteRid++);
            var archivo = 'grafico' + medios.length + '.' + dim.tipo;
            medios.push({ rid: rid, archivo: archivo, bytes: b.imagen.bytes, tipo: dim.tipo });
            cuerpo += marco(
              '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' +
              dibujo(rid, tam.cx, tam.cy, siguienteId++, b.nombre || 'Gráfico') +
              '</w:p>' + (b.pie ? pieDeGrafico(b.pie) : '')
            ) + vacio();
          } else {
            cuerpo += marcador(b.nombre || 'pendiente') + vacio();

          break;
        default:

    });

    var documentXml = NS_DOCUMENTO + '<w:body>' + cuerpo + SECT_PR + '</w:body></w:document>';

    // Relaciones del documento.
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    RELS_FIJAS.forEach(function (r) {
      rels += '<Relationship Id="' + r[0] + '" Type="http://schemas.openxmlformats.org/' +
        'officeDocument/2006/relationships/' + r[1] + '" Target="' + r[2] + '"/>';
    });
    medios.forEach(function (m) {
      rels += '<Relationship Id="' + m.rid + '" Type="http://schemas.openxmlformats.org/' +
        'officeDocument/2006/relationships/image" Target="media/' + m.archivo + '"/>';
    });
    rels += '</Relationships>';

    // Tipos de contenido: los que siempre van, mas las extensiones de imagen usadas.
    var exts = { jpeg: true };
    medios.forEach(function (m) { exts[m.tipo] = true; });
    var tipos = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>';
    Object.keys(exts).forEach(function (e) {
      tipos += '<Default Extension="' + e + '" ContentType="image/' +
        (e === 'jpeg' ? 'jpeg' : e) + '"/>';
    });
    [['document', 'document.main'], ['numbering', 'numbering'], ['styles', 'styles'],
     ['settings', 'settings'], ['webSettings', 'webSettings'], ['footnotes', 'footnotes'],
     ['endnotes', 'endnotes'], ['header1', 'header'], ['footer1', 'footer'],
     ['fontTable', 'fontTable']].forEach(function (t) {
      tipos += '<Override PartName="/word/' + t[0] + '.xml" ContentType="application/vnd.' +
        'openxmlformats-officedocument.wordprocessingml.' + t[1] + '+xml"/>';
    });
    tipos += '<Override PartName="/word/theme/theme1.xml" ' +
      'ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
      '<Override PartName="/docProps/core.xml" ' +
      'ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ' +
      'ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
      '</Types>';

  window.addEventListener("beforeunload", function(e){
    if(!S || !DIRTY) return;

    e.returnValue = "";
  });

  await cargarCatalogo();

  setInterval(function(){ if(S && DIRTY) guardar(true); }, 15000);
